<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06182b">
<title>KT10 · Rekod Penyelenggaraan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020817;--panel:#0a2038ed;--line:#94a3b838;--text:#f8fafc;--muted:#cbd5e1;--blue:#2563eb;--purple:#7c3aed;--orange:#f59e0b;--green:#16a34a;--red:#dc2626;--shadow:0 22px 65px #0007}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 10%,#2563eb45,transparent 30%),radial-gradient(circle at 90% 88%,#7c3aed38,transparent 30%),linear-gradient(135deg,var(--bg),#071a2d)}
button{font:inherit;cursor:pointer}.shell{width:min(1450px,calc(100% - 28px));margin:auto;padding:16px 0 48px}.header{position:sticky;top:10px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border:1px solid var(--line);border-radius:20px;background:#020c19ee;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:14px}.logo{display:grid;place-items:center;width:64px;height:64px;flex:0 0 64px;border:2px solid #ffffff50;border-radius:18px;background:#fff;font-size:34px}.brand h1{margin:0;font-family:Montserrat,sans-serif;font-size:clamp(18px,2vw,28px)}.brand small{display:block;margin-top:4px;color:#60a5fa;font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button,.secondary{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#ffffff12;color:#fff;font-weight:800}
.card{margin-top:18px;padding:clamp(20px,4vw,40px);border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#0c2541f2,#041222f2);box-shadow:var(--shadow)}.cover{text-align:center;min-height:650px;display:grid;place-items:center}.tag{display:inline-block;padding:9px 16px;border:1px solid #f59e0b72;border-radius:999px;background:#f59e0b25;color:#fde68a;font-weight:900}.hero-icon{font-size:clamp(90px,13vw,150px);margin:18px}.cover h2,.title{font-family:Montserrat,sans-serif}.cover h2{margin:0;font-size:clamp(34px,5vw,66px)}.lead{max-width:950px;margin:16px auto;color:var(--muted);font-size:clamp(17px,2vw,23px);line-height:1.7}.candidate{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:920px;margin:25px auto}.candidate div{padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff0c}.candidate small,.candidate b{display:block}.candidate small{color:var(--muted)}.start,.submit,.continue{padding:15px 24px;border:0;border-radius:14px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--purple))}
.topline{display:flex;justify-content:space-between;gap:15px;align-items:center}.title{margin:0;font-size:clamp(28px,4vw,46px)}.counter{padding:10px 14px;border-radius:999px;background:#2563eb33;color:#bfdbfe;font-weight:900}.progress{height:14px;margin:18px 0 30px;overflow:hidden;border-radius:999px;background:#020b16}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#facc15,var(--green));transition:.3s}.question{padding:22px;border:1px solid var(--line);border-radius:18px;background:#ffffff0c}.question h3{font-size:clamp(20px,2.4vw,29px);line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.option{padding:16px;border:1px solid var(--line);border-radius:13px;background:#ffffff0d;color:#fff;text-align:left;font-weight:700}.option:hover{border-color:#60a5fa}.option.selected{border-color:#60a5fa;background:#2563eb35}.qnav{display:flex;justify-content:space-between;gap:14px;margin-top:22px}.qnav button{min-width:160px;padding:13px 18px;border-radius:13px}.submit{background:linear-gradient(135deg,var(--orange),#d97706);color:#111827}
.result{text-align:center;min-height:650px;display:grid;place-items:center}.seal{font-size:115px}.score{font-family:Montserrat,sans-serif;font-size:clamp(65px,10vw,120px);font-weight:900;color:#fde68a}.status{display:inline-block;padding:11px 22px;border-radius:999px;font-size:clamp(22px,3vw,34px);font-weight:900}.pass{background:#16a34a32;color:#bbf7d0;border:1px solid #22c55e}.fail{background:#dc262630;color:#fecaca;border:1px solid #ef4444}.reward{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:700px;margin:25px auto}.reward div{padding:16px;border:1px solid var(--line);border-radius:15px;background:#ffffff0c}.review{text-align:left;margin-top:26px}.review article{margin:11px 0;padding:16px;border-radius:14px;background:#ffffff0c;border-left:5px solid var(--red)}.review article.ok{border-left-color:var(--green)}.review small{color:var(--muted)}
@media(max-width:800px){.header{position:relative;align-items:flex-start;flex-direction:column}.tools{width:100%}.tools button{flex:1}.candidate,.options,.reward{grid-template-columns:1fr}.qnav{flex-direction:column}.qnav button{width:100%}}
</style>
</head>
<body>
<main id="app"></main>
<script src="../storage.js"></script>
<script>
const app=document.getElementById("app");
const store=window.C05Storage||window.SHStorage;
function defaults(){return{lang:"ms",student:{name:"Agent Server",id:"—",className:"—"},unlocked:8,completedKP:[],ktScores:{},xp:0,coins:0,badges:[]}}
function load(){if(store?.load)return store.load();try{return{...defaults(),...JSON.parse(localStorage.getItem("serverHeroV5State")||"{}")}}catch(e){return defaults()}}
function save(){try{if(store?.save)store.save(state);else localStorage.setItem("serverHeroV5State",JSON.stringify(state));return true}catch(e){console.warn("Progress could not be saved in this preview.",e);return false}}
let state=load(),lang=state.lang||"ms",screen="cover",index=0,answers=Array(10).fill(null),score=0,passed=false;
const Q=[
 {ms:"Apakah tujuan utama rekod penyelenggaraan server?",en:"What is the main purpose of a server maintenance record?",o:{ms:["Mendokumentasikan kerja untuk rujukan, audit dan tindakan susulan","Menggantikan semua sandaran server","Menghapuskan keperluan pemantauan","Menukar alamat IP secara automatik"],en:["Document work for reference, audits and follow-up actions","Replace all server backups","Eliminate the need for monitoring","Automatically change IP addresses"]},a:0},
 {ms:"Maklumat manakah paling penting untuk mengenal pasti server yang disenggara?",en:"Which information is most important for identifying the maintained server?",o:{ms:["Nama aset, nombor siri dan lokasi","Warna meja juruteknik","Jenama telefon pengguna","Saiz bilik mesyuarat"],en:["Asset name, serial number and location","Technician's desk colour","User's phone brand","Meeting room size"]},a:0},
 {ms:"Mengapakah tarikh mula dan tamat kerja perlu direkodkan?",en:"Why should the work start and end dates be recorded?",o:{ms:["Menentukan tempoh kerja dan jejak kronologi","Menambah kapasiti storan","Mencipta akaun domain","Menggantikan kata laluan pengguna"],en:["Establish the work duration and chronological trail","Increase storage capacity","Create domain accounts","Replace user passwords"]},a:0},
 {ms:"Apakah yang perlu ditulis pada bahagian tindakan penyelenggaraan?",en:"What should be written in the maintenance action section?",o:{ms:["Langkah sebenar yang dilakukan dan perubahan yang dibuat","Nama semua pelawat bangunan","Harga komputer peribadi","Senarai laman web kegemaran"],en:["Actual steps performed and changes made","Names of all building visitors","Price of a personal computer","List of favourite websites"]},a:0},
 {ms:"Status manakah sesuai jika masalah telah diselesaikan dan diuji?",en:"Which status is appropriate when an issue has been resolved and tested?",o:{ms:["Selesai dan disahkan","Belum diperiksa","Menunggu tanpa sebab","Dibatalkan secara automatik"],en:["Completed and verified","Not inspected","Waiting without reason","Automatically cancelled"]},a:0},
 {ms:"Mengapakah nama dan pengesahan juruteknik perlu dicatat?",en:"Why should the technician's name and verification be recorded?",o:{ms:["Menetapkan tanggungjawab dan akauntabiliti kerja","Meningkatkan kelajuan CPU","Mengurangkan bilangan pengguna","Menukar konfigurasi DNS"],en:["Establish responsibility and accountability for the work","Increase CPU speed","Reduce the number of users","Change DNS configuration"]},a:0},
 {ms:"Apakah contoh bukti penyelenggaraan yang sesuai?",en:"What is a suitable example of maintenance evidence?",o:{ms:["Tangkapan skrin, log sistem atau laporan ujian","Gambar percutian juruteknik","Resit makan tengah hari","Senarai muzik pengguna"],en:["Screenshots, system logs or test reports","Technician's holiday photos","Lunch receipt","User's music list"]},a:0},
 {ms:"Masalah belum selesai sepenuhnya. Apakah yang perlu direkodkan?",en:"An issue is not fully resolved. What should be recorded?",o:{ms:["Tindakan susulan, pegawai bertanggungjawab dan tarikh sasaran","Tandakan selesai tanpa ujian","Padam semua catatan terdahulu","Kosongkan ruangan status"],en:["Follow-up action, responsible person and target date","Mark it completed without testing","Delete all previous notes","Leave the status field blank"]},a:0},
 {ms:"Apakah ciri rekod penyelenggaraan yang berkualiti?",en:"What characterises a quality maintenance record?",o:{ms:["Tepat, lengkap, jelas dan boleh disahkan","Ringkas tetapi tanpa tarikh","Menggunakan singkatan yang tidak diterangkan","Diubah tanpa sejarah perubahan"],en:["Accurate, complete, clear and verifiable","Brief but without a date","Uses unexplained abbreviations","Changed without revision history"]},a:0},
 {ms:"Selepas penyelenggaraan, server masih gagal ujian perkhidmatan. Apakah rekod yang betul?",en:"After maintenance, the server still fails a service test. What is the correct record?",o:{ms:["Catat keputusan gagal, bukti, tindakan pemulihan dan eskalasi","Tandakan berjaya untuk menutup laporan","Padam keputusan ujian","Jangan maklumkan kepada sesiapa"],en:["Record the failure, evidence, recovery action and escalation","Mark it successful to close the report","Delete the test result","Do not inform anyone"]},a:0}
];
const ANSWER_ORDER=[1,0,3,2,1,3,0,2,1,3];
Q.forEach((q,i)=>{
 const target=ANSWER_ORDER[i],current=q.a;
 if(target!==current){
  ["ms","en"].forEach(lang=>{
   const correct=q.o[lang][current];
   q.o[lang].splice(current,1);
   q.o[lang].splice(target,0,correct);
  });
  q.a=target;
 }
});
const T={
 ms:{title:"KT10 · Rekod Penyelenggaraan",sub:"KERTAS TUGASAN 10 · MARKAH FIX V4",intro:"Jawab semua 10 soalan. Markah 60% dan ke atas ialah TERAMPIL. Lulus KT10 melengkapkan SERVER HERO.",name:"Nama Pelajar",id:"ID Pelajar",cls:"Kelas",start:"MULA KT10",dash:"Dashboard",lang:"English",full:"Skrin Penuh",question:"Soalan",back:"Kembali",next:"Seterusnya",submit:"Hantar Jawapan",complete:"Keputusan KT10",skor:"Markah",competent:"TERAMPIL",notYet:"BELUM TERAMPIL",passMsg:"Tahniah! Anda telah menamatkan semua 10 KP dan 10 KT.",failMsg:"Anda perlu mencapai sekurang-kurangnya 60%. Cuba semula selepas membuat ulang kaji.",xp:"XP",coins:"Syiling",unlock:"Status Kursus",finished:"TAMAT 100%",dashboard:"KEMBALI KE DASHBOARD",retry:"CUBA SEMULA",review:"Semakan Jawapan",correct:"Jawapan betul",chosen:"Jawapan anda",unanswered:"Sila jawab soalan ini dahulu."},
 en:{title:"KT10 · Maintenance Records",sub:"TASK PAPER 10 · SCORE FIX V4",intro:"Answer all 10 questions. A score of 60% or above is COMPETENT. Passing KT10 completes SERVER HERO.",name:"Student Name",id:"Student ID",cls:"Class",start:"START KT10",dash:"Dashboard",lang:"Bahasa Melayu",full:"Fullscreen",question:"Question",back:"Back",next:"Next",submit:"Submit Answers",complete:"KT10 Result",skor:"Score",competent:"COMPETENT",notYet:"NOT YET COMPETENT",passMsg:"Congratulations! You have completed all 10 information and task papers.",failMsg:"You must score at least 60%. Review the lesson and try again.",xp:"XP",coins:"Coins",unlock:"Course Status",finished:"100% COMPLETE",dashboard:"RETURN TO DASHBOARD",retry:"TRY AGAIN",review:"Answer Review",correct:"Correct answer",chosen:"Your answer",unanswered:"Please answer this question first."}
};
const t=k=>T[lang][k]||k;
function header(){return `<header class="header"><div class="brand"><div class="logo">🏫</div><div><h1>${t("title")}</h1><small>C05 – SERVER MAINTENANCE</small></div></div><div class="tools"><button onclick="dash()">← ${t("dash")}</button><button onclick="toggleLang()">🌐 ${t("lang")}</button><button onclick="full()">⛶ ${t("full")}</button></div></header>`}
function render(){
 if(screen==="cover")app.innerHTML=`<div class="shell">${header()}<section class="card cover"><div><span class="tag">${t("sub")}</span><div class="hero-icon">📋</div><h2>${t("title").replace("KT10 · ","")}</h2><p class="lead">${t("intro")}</p><div class="candidate"><div><small>${t("name")}</small><b>${state.student?.name||"Agent Server"}</b></div><div><small>${t("id")}</small><b>${state.student?.id||"—"}</b></div><div><small>${t("cls")}</small><b>${state.student?.className||state.student?.class||"—"}</b></div></div><button class="start" onclick="start()">${t("start")} →</button></div></section></div>`;
 else if(screen==="quiz")renderQuiz();else renderResult();
}
function renderQuiz(){
 const q=Q[index],pct=Math.round((index+1)/Q.length*100);
 app.innerHTML=`<div class="shell">${header()}<section class="card"><div class="topline"><h2 class="title">${t("sub")}</h2><span class="counter">${t("question")} ${index+1}/10</span></div><div class="progress"><i style="width:${pct}%"></i></div><article class="question"><h3>${index+1}. ${q[lang]}</h3><div class="options">${q.o[lang].map((x,i)=>`<button class="option ${answers[index]===i?"selected":""}" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join("")}</div></article><nav class="qnav"><button class="secondary" onclick="prev()" ${index===0?"disabled":""}>← ${t("back")}</button>${index===9?`<button class="submit" onclick="submitKT()">${t("submit")} ✓</button>`:`<button class="start" onclick="next()">${t("next")} →</button>`}</nav></section></div>`;
}
function renderResult(){
 const review=Q.map((q,i)=>`<article class="${answers[i]===q.a?"ok":""}"><b>${i+1}. ${q[lang]}</b><br><small>${t("chosen")}: ${answers[i]===null?"—":q.o[lang][answers[i]]}<br>${t("correct")}: ${q.o[lang][q.a]}</small></article>`).join("");
 app.innerHTML=`<div class="shell">${header()}<section class="card result"><div><div class="seal">${passed?"🏆":"📘"}</div><h2 class="title">${t("complete")}</h2><div class="score"><small style="display:block;font:800 18px Poppins,sans-serif;color:#cbd5e1">${t("skor")}</small>${score}%</div><div class="status ${passed?"pass":"fail"}">${passed?t("competent"):t("notYet")}</div><p class="lead">${passed?t("passMsg"):t("failMsg")}</p>${passed?`<div class="reward"><div><small>${t("xp")}</small><b>+180</b></div><div><small>${t("coins")}</small><b>+90</b></div><div><small>${t("unlock")}</small><b>${t("finished")}</b></div></div><button class="continue" onclick="dash()">${t("dashboard")} →</button>`:`<button class="start" onclick="retry()">↻ ${t("retry")}</button>`}<div class="review"><h3>${t("review")}</h3>${review}</div></div></section></div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function start(){screen="quiz";render()}function choose(i){answers[index]=i;renderQuiz()}function prev(){if(index>0){index--;renderQuiz()}}function next(){if(answers[index]===null){alert(t("unanswered"));return}if(index<9){index++;renderQuiz()}}
function submitKT(){
 if(answers.some(v=>v===null)){alert(t("unanswered"));index=answers.findIndex(v=>v===null);renderQuiz();return}
 score=Q.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0)*10;passed=score>=60;
 screen="result";
 render();
 try{
  if(!state||typeof state!=="object")state=defaults();
  if(!state.ktScores||typeof state.ktScores!=="object")state.ktScores={};
  const previous=Number(state.ktScores["10"]??state.ktScores.kt10??state.ktScores.KT10??0);
  const best=Math.max(previous,score);
  state.ktScores["10"]=best;state.ktScores.kt10=best;state.ktScores.KT10=best;
  if(passed){const first=previous<60;state.unlocked=10;state.courseCompleted=true;if(!Array.isArray(state.badges))state.badges=[];if(!state.badges.includes("kt10-pass"))state.badges.push("kt10-pass");if(!state.badges.includes("server-hero-complete"))state.badges.push("server-hero-complete");if(first){state.xp=(Number(state.xp)||0)+180;state.coins=(Number(state.coins)||0)+90}}
  if(!Array.isArray(state.history))state.history=[];
  state.history.push({type:"KT10",score,status:passed?"TERAMPIL":"BELUM TERAMPIL",date:new Date().toISOString()});
  save();
 }catch(e){console.warn("Markah dipaparkan tetapi rekod kemajuan tidak dapat disimpan.",e)}
}
function retry(){index=0;answers=Array(10).fill(null);score=0;passed=false;screen="quiz";render()}function toggleLang(){lang=lang==="ms"?"en":"ms";state.lang=lang;save();render()}function dash(){location.href="../index.html"}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
render();
</script>
</body>
</html>
