<style>
:root{--bg:#020817;--panel:#0a2038ed;--line:#94a3b838;--text:#f8fafc;--muted:#cbd5e1;--blue:#2563eb;--purple:#7c3aed;--orange:#f59e0b;--green:#16a34a;--red:#dc2626;--shadow:0 22px 65px #0007}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 10%,#2563eb45,transparent 30%),radial-gradient(circle at 90% 88%,#7c3aed38,transparent 30%),linear-gradient(135deg,var(--bg),#071a2d)}
button{font:inherit;cursor:pointer}.shell{width:min(1450px,calc(100% - 28px));margin:auto;padding:16px 0 48px}.header{position:sticky;top:10px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border:1px solid var(--line);border-radius:20px;background:#020c19ee;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:14px}.logo{display:grid;place-items:center;width:64px;height:64px;flex:0 0 64px;border:2px solid #ffffff50;border-radius:18px;background:#fff;font-size:34px}.brand h1{margin:0;font-family:Montserrat,sans-serif;font-size:clamp(18px,2vw,28px)}.brand small{display:block;margin-top:4px;color:#60a5fa;font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button,.secondary{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#ffffff12;color:#fff;font-weight:800}
.card{margin-top:18px;padding:clamp(20px,4vw,40px);border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#0c2541f2,#041222f2);box-shadow:var(--shadow)}.cover{text-align:center;min-height:650px;display:grid;place-items:center}.tag{display:inline-block;padding:9px 16px;border:1px solid #f59e0b72;border-radius:999px;background:#f59e0b25;color:#fde68a;font-weight:900}.hero-icon{font-size:clamp(90px,13vw,150px);margin:18px}.cover h2,.title{font-family:Montserrat,sans-serif}.cover h2{margin:0;font-size:clamp(34px,5vw,66px)}.lead{max-width:950px;margin:16px auto;color:var(--muted);font-size:clamp(17px,2vw,23px);line-height:1.7}.candidate{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:920px;margin:25px auto}.candidate div{padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff0c}.candidate small,.candidate b{display:block}.candidate small{color:var(--muted)}.start,.submit,.continue{padding:15px 24px;border:0;border-radius:14px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--purple))}
.topline{display:flex;justify-content:space-between;gap:15px;align-items:center}.title{margin:0;font-size:clamp(28px,4vw,46px)}.counter{padding:10px 14px;border-radius:999px;background:#2563eb33;color:#bfdbfe;font-weight:900}.progress{height:14px;margin:18px 0 30px;overflow:hidden;border-radius:999px;background:#020b16}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#facc15,var(--green));transition:.3s}.question{padding:22px;border:1px solid var(--line);border-radius:18px;background:#ffffff0c}.question h3{font-size:clamp(20px,2.4vw,29px);line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.option{padding:16px;border:1px solid var(--line);border-radius:13px;background:#ffffff0d;color:#fff;text-align:left;font-weight:700}.option:hover{border-color:#60a5fa}.option.selected{border-color:#60a5fa;background:#2563eb35}.qnav{display:flex;justify-content:space-between;gap:14px;margin-top:22px}.qnav button{min-width:160px;padding:13px 18px;border-radius:13px}.submit{background:linear-gradient(135deg,var(--orange),#d97706);color:#111827}
.result{text-align:center;min-height:650px;display:grid;place-items:center}.seal{font-size:115px}.score{font-family:Montserrat,sans-serif;font-size:clamp(65px,10vw,120px);font-weight:900;color:#fde68a}.status{display:inline-block;padding:11px 22px;border-radius:999px;font-size:clamp(22px,3vw,34px);font-weight:900}.pass{background:#16a34a32;color:#bbf7d0;border:1px solid #22c55e}.fail{background:#dc262630;color:#fecaca;border:1px solid #ef4444}.reward{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:700px;margin:25px auto}.reward div{padding:16px;border:1px solid var(--line);border-radius:15px;background:#ffffff0c}.review{text-align:left;margin-top:26px}.review article{margin:11px 0;padding:16px;border-radius:14px;background:#ffffff0c;border-left:5px solid var(--red)}.review article.ok{border-left-color:var(--green)}.review small{color:var(--muted)}
.timer{display:inline-flex;align-items:center;justify-content:center;min-width:118px;padding:10px 14px;border:2px solid #f59e0b;border-radius:999px;background:#451a03;color:#fde68a;font-weight:900;font-variant-numeric:tabular-nums}.timer.urgent{border-color:#ef4444;background:#450a0a;color:#fecaca}.locked-note{margin:16px 0;padding:14px;border:1px solid #ef4444;border-radius:14px;background:#450a0a;color:#fecaca;font-weight:800}
@media(max-width:800px){.header{position:relative;align-items:flex-start;flex-direction:column}.tools{width:100%}.tools button{flex:1}.candidate,.options,.reward{grid-template-columns:1fr}.qnav{flex-direction:column}.qnav button{width:100%}}
</style>

<body>
<main id="app"></main>
<script src="../storage.js"></script>
<script src="../firebase-sync.js?v=1.1.0"></script>
<script type="module" src="../firebase-config.js?v=1.1.0"></script>
<script>
const app=document.getElementById("app");
const store=window.C05Storage||window.SHStorage;
function defaults(){return{lang:"ms",student:{name:"Agent Server",id:"—",className:"—"},unlocked:8,completedKP:[],ktScores:{},xp:0,coins:0,badges:[]}}
function load(){if(store?.load)return store.load();try{return{...defaults(),...JSON.parse(localStorage.getItem("serverHeroV5State")||"{}")}}catch(e){return defaults()}}
function save(){if(store?.save)store.save(state);else localStorage.setItem("serverHeroV5State",JSON.stringify(state))}
let state=load(),lang=state.lang||"ms",screen="cover",index=0,answers=Array(10).fill(null),score=0,passed=false;
if((Number(state.unlocked)||1)<9){alert(lang==="en"?"This task paper is locked. Pass KT08 with at least 60% first.":"Kertas tugasan ini dikunci. Lulus KT08 sekurang-kurangnya 60% dahulu.");location.href="../index.html";throw new Error("KT09 locked")}
const KT_NUMBER=9;
const NEXT_KP=10;
const TIME_LIMIT_MS=30*60*1000;
const TIMER_KEY=`c05-kt${String(KT_NUMBER).padStart(2,"0")}-${String(state.student?.id||"guest").toUpperCase()}-deadline`;
let timerHandle=null,deadline=0,timeExpired=false,submitted=false;
const Q=[
 {
  "ms": "Apakah tujuan utama penyelenggaraan perisian server?",
  "en": "What is the main purpose of server software maintenance?",
  "o": {
   "ms": [
    "Menambah bilangan kabel rangkaian",
    "Memastikan sistem stabil, selamat dan berprestasi baik",
    "Menggantikan rak server setiap minggu",
    "Menukar alamat MAC semua klien"
   ],
   "en": [
    "Increase the number of network cables",
    "Keep the system stable, secure and performing well",
    "Replace the server rack every week",
    "Change every client's MAC address"
   ]
  },
  "a": 1
 },
 {
  "ms": "Mengapakah kemas kini keselamatan perlu dipasang secara berkala?",
  "en": "Why should security updates be installed regularly?",
  "o": {
   "ms": [
    "Menutup kelemahan yang boleh dieksploitasi",
    "Menambah saiz monitor",
    "Menghapuskan keperluan sandaran",
    "Menukar nama domain secara automatik"
   ],
   "en": [
    "Patch vulnerabilities that could be exploited",
    "Increase the monitor size",
    "Eliminate the need for backups",
    "Automatically change the domain name"
   ]
  },
  "a": 0
 },
 {
  "ms": "Apakah tindakan terbaik sebelum memasang kemas kini besar pada server?",
  "en": "What is the best action before installing a major server update?",
  "o": {
   "ms": [
    "Matikan semua akaun pengguna",
    "Padam semua log sistem",
    "Nyahaktifkan antivirus secara kekal",
    "Buat sandaran dan titik pemulihan yang sah"
   ],
   "en": [
    "Disable all user accounts",
    "Delete all system logs",
    "Permanently disable antivirus",
    "Create a verified backup and recovery point"
   ]
  },
  "a": 3
 },
 {
  "ms": "Apakah fungsi utama perisian antivirus pada server?",
  "en": "What is the main function of antivirus software on a server?",
  "o": {
   "ms": [
    "Mencipta rekod DNS",
    "Mengagihkan alamat IP kepada klien",
    "Mengesan, mengkuarantin dan menghapuskan ancaman",
    "Mengurus unit organisasi"
   ],
   "en": [
    "Create DNS records",
    "Distribute IP addresses to clients",
    "Detect, quarantine and remove threats",
    "Manage organizational units"
   ]
  },
  "a": 2
 },
 {
  "ms": "Apakah maksud kuarantin dalam perisian antivirus?",
  "en": "What does quarantine mean in antivirus software?",
  "o": {
   "ms": [
    "Memadam semua fail pengguna secara automatik",
    "Mengasingkan fail mencurigakan supaya tidak boleh merosakkan sistem",
    "Memindahkan server ke rangkaian lain",
    "Memasang semula sistem operasi"
   ],
   "en": [
    "Automatically delete every user file",
    "Isolate suspicious files so they cannot harm the system",
    "Move the server to another network",
    "Reinstall the operating system"
   ]
  },
  "a": 1
 },
 {
  "ms": "Mengapakah log sistem dan aplikasi perlu disemak?",
  "en": "Why should system and application logs be reviewed?",
  "o": {
   "ms": [
    "Memendekkan kabel rangkaian",
    "Menambah kapasiti RAM fizikal",
    "Menggantikan alamat IP statik",
    "Mengenal pasti ralat, amaran dan aktiviti luar biasa"
   ],
   "en": [
    "Shorten network cables",
    "Increase physical RAM capacity",
    "Replace the static IP address",
    "Identify errors, warnings and unusual activity"
   ]
  },
  "a": 3
 },
 {
  "ms": "Perisian yang tidak digunakan pada server sepatutnya bagaimana?",
  "en": "What should be done with unused software on a server?",
  "o": {
   "ms": [
    "Nyahpasang selepas menilai kebergantungan dan risiko",
    "Biarkan semuanya berjalan di latar belakang",
    "Salin ke setiap komputer klien",
    "Tetapkan sebagai aplikasi permulaan"
   ],
   "en": [
    "Uninstall it after assessing dependencies and risks",
    "Leave all of it running in the background",
    "Copy it to every client computer",
    "Set it as a startup application"
   ]
  },
  "a": 0
 },
 {
  "ms": "Bilakah penyelenggaraan yang boleh mengganggu perkhidmatan patut dijalankan?",
  "en": "When should maintenance that may interrupt services be performed?",
  "o": {
   "ms": [
    "Tanpa memaklumkan pengguna",
    "Semasa waktu penggunaan paling sibuk",
    "Dalam maintenance window yang dirancang",
    "Setiap kali pengguna sedang log masuk"
   ],
   "en": [
    "Without informing users",
    "During peak usage hours",
    "During a planned maintenance window",
    "Whenever users are logged in"
   ]
  },
  "a": 2
 },
 {
  "ms": "Selepas memasang patch, apakah langkah pengesahan yang betul?",
  "en": "After installing a patch, what is the correct verification step?",
  "o": {
   "ms": [
    "Padam sandaran dengan segera",
    "Uji perkhidmatan utama dan semak log untuk ralat",
    "Tukar semua kata laluan tanpa sebab",
    "Nyahaktifkan firewall"
   ],
   "en": [
    "Delete the backup immediately",
    "Test critical services and review logs for errors",
    "Change all passwords without reason",
    "Disable the firewall"
   ]
  },
  "a": 1
 },
 {
  "ms": "Kemas kini menyebabkan perkhidmatan kritikal gagal. Apakah tindakan paling sesuai?",
  "en": "An update causes a critical service to fail. What is the most appropriate action?",
  "o": {
   "ms": [
    "Padam rekod penyelenggaraan",
    "Terus abaikan kegagalan tersebut",
    "Format semua cakera server",
    "Laksanakan pelan rollback dan pulihkan versi stabil"
   ],
   "en": [
    "Delete the maintenance records",
    "Continue to ignore the failure",
    "Format every server disk",
    "Execute the rollback plan and restore the stable version"
   ]
  },
  "a": 3
 }
];
const T={
 ms:{title:"KT09 · Penyelenggaraan Perisian",sub:"KERTAS TUGASAN 09",intro:"Jawab semua 10 soalan. Markah 60% dan ke atas ialah TERAMPIL. Lulus KT09 akan membuka KP10.",name:"Nama Pelajar",id:"ID Pelajar",cls:"Kelas",start:"MULA KT09",dash:"Dashboard",lang:"English",full:"Skrin Penuh",question:"Soalan",back:"Kembali",next:"Seterusnya",submit:"Hantar Jawapan",confirm:"Adakah anda pasti mahu menghantar jawapan?",complete:"Keputusan KT09",skor:"Markah",competent:"TERAMPIL",notYet:"BELUM TERAMPIL",passMsg:"Tahniah! KP10 kini telah dibuka.",failMsg:"Anda perlu mencapai sekurang-kurangnya 60%. Cuba semula selepas membuat ulang kaji.",xp:"XP",coins:"Syiling",unlock:"Modul Dibuka",kp10:"TERUSKAN KE KP10",retry:"CUBA SEMULA",review:"Semakan Jawapan",correct:"Jawapan betul",chosen:"Jawapan anda",unanswered:"Sila jawab soalan ini dahulu."},
 en:{title:"KT09 · Software Maintenance",sub:"TASK PAPER 09",intro:"Answer all 10 questions. A score of 60% or above is COMPETENT. Passing KT09 unlocks KP10.",name:"Student Name",id:"Student ID",cls:"Class",start:"START KT09",dash:"Dashboard",lang:"Bahasa Melayu",full:"Fullscreen",question:"Question",back:"Back",next:"Next",submit:"Submit Answers",confirm:"Are you sure you want to submit your answers?",complete:"KT09 Result",skor:"Score",competent:"COMPETENT",notYet:"NOT YET COMPETENT",passMsg:"Congratulations! KP10 is now unlocked.",failMsg:"You must score at least 60%. Review the lesson and try again.",xp:"XP",coins:"Coins",unlock:"Module Unlocked",kp10:"CONTINUE TO KP10",retry:"TRY AGAIN",review:"Answer Review",correct:"Correct answer",chosen:"Your answer",unanswered:"Please answer this question first."}
};
const t=k=>T[lang][k]||k;
function header(){return `<header class="header"><div class="brand"><div class="logo">🏫</div><div><h1>${t("title")}</h1><small>C05 – SERVER MAINTENANCE</small></div></div><div class="tools"><span class="timer" id="timerDisplay">⏱️ 30:00</span><button onclick="dash()">← ${t("dash")}</button><button onclick="toggleLang()">🌐 ${t("lang")}</button><button onclick="full()">⛶ ${t("full")}</button></div></header>`}
function render(){
 if(screen==="cover")app.innerHTML=`<div class="shell">${header()}<section class="card cover"><div><span class="tag">${t("sub")}</span><div class="hero-icon">🧩</div><h2>${t("title").replace("KT09 · ","")}</h2><p class="lead">${t("intro")}</p><div class="candidate"><div><small>${t("name")}</small><b>${state.student?.name||"Agent Server"}</b></div><div><small>${t("id")}</small><b>${state.student?.id||"—"}</b></div><div><small>${t("cls")}</small><b>${state.student?.className||state.student?.class||"—"}</b></div></div><button class="start" onclick="start()">${t("start")} →</button></div></section></div>`;
 else if(screen==="quiz")renderQuiz();else renderResult();
}
function renderQuiz(){
 const q=Q[index],pct=Math.round((index+1)/Q.length*100);
 app.innerHTML=`<div class="shell">${header()}<section class="card"><div class="topline"><h2 class="title">${t("sub")}</h2><span class="counter">${t("question")} ${index+1}/10</span></div><div class="progress"><i style="width:${pct}%"></i></div><article class="question"><h3>${index+1}. ${q[lang]}</h3><div class="options">${q.o[lang].map((x,i)=>`<button class="option ${answers[index]===i?"selected":""}" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join("")}</div></article><nav class="qnav"><button class="secondary" onclick="prev()" ${index===0?"disabled":""}>← ${t("back")}</button>${index===9?`<button class="submit" onclick="submitKT()">${t("submit")} ✓</button>`:`<button class="start" onclick="next()">${t("next")} →</button>`}</nav></section></div>`;

 updateTimerDisplay();
}
function renderResult(){
 const review=Q.map((q,i)=>`<article class="${answers[i]===q.a?"ok":""}"><b>${i+1}. ${q[lang]}</b><br><small>${t("chosen")}: ${answers[i]===null?"—":q.o[lang][answers[i]]}<br>${t("correct")}: ${q.o[lang][q.a]}</small></article>`).join("");
 app.innerHTML=`<div class="shell">${header()}<section class="card result"><div><div class="seal">${passed?"🏆":"📘"}</div><h2 class="title">${t("complete")}</h2><div class="score">${score}%</div><div class="status ${passed?"pass":"fail"}">${passed?t("competent"):t("notYet")}</div><p class="lead">${passed?t("passMsg"):t("failMsg")}</p>${passed?`<div class="reward"><div><small>${t("xp")}</small><b>+180</b></div><div><small>${t("coins")}</small><b>+90</b></div><div><small>${t("unlock")}</small><b>KP10</b></div></div><button class="continue" onclick="kp10()">${t("kp10")} →</button>`:`<button class="start" onclick="retry()">↻ ${t("retry")}</button>`}<div class="review"><h3>${t("review")}</h3>${review}</div></div></section></div>`;
}
function start(){
 deadline=Date.now()+TIME_LIMIT_MS;
 sessionStorage.setItem(TIMER_KEY,String(deadline));
 timeExpired=false;submitted=false;screen="quiz";render();startTimer();
}
function choose(i){if(timeExpired||submitted)return;answers[index]=i;renderQuiz()}
function prev(){if(timeExpired||submitted)return;if(index>0){index--;renderQuiz()}}
function next(){if(timeExpired||submitted)return;if(answers[index]===null){alert(t("unanswered"));return}if(index<9){index++;renderQuiz()}}
function submitKT(force=false){
 if(submitted)return;
 if(!force&&answers.some(v=>v===null)){alert(t("unanswered"));index=answers.findIndex(v=>v===null);renderQuiz();return}
 submitted=true;timeExpired=force||timeExpired;clearTimer();
 score=Q.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0)*10;
 passed=score>=60;
 screen="result";render();
 try{
   const key=`kt${String(KT_NUMBER).padStart(2,"0")}`;
   const previous=Number(state.ktBestScores?.[key]??state.ktScores?.[key]??state.ktScores?.[String(KT_NUMBER)]??0)||0;
   C05Storage.saveKTResult(state,KT_NUMBER,score);
   state=C05Storage.load();
   if(passed){
     const first=previous<60;
     if(!Array.isArray(state.badges))state.badges=[];
     const badge=`kt${String(KT_NUMBER).padStart(2,"0")}-pass`;
     if(!state.badges.includes(badge))state.badges.push(badge);
     if(first){state.xp=(Number(state.xp)||0)+150;state.coins=(Number(state.coins)||0)+75;}
   }
   if(!Array.isArray(state.history))state.history=[];
   state.history.push({type:`KT${String(KT_NUMBER).padStart(2,"0")}`,score,status:passed?"TERAMPIL":"BELUM TERAMPIL",timedOut:timeExpired,date:new Date().toISOString()});
   C05Storage.save(state);
 }catch(e){console.warn(`Rekod KT${KT_NUMBER} tidak dapat disimpan`,e)}
}
function retry(){
 clearTimer();index=0;answers=Array(10).fill(null);score=0;passed=false;submitted=false;timeExpired=false;screen="quiz";
 deadline=Date.now()+TIME_LIMIT_MS;sessionStorage.setItem(TIMER_KEY,String(deadline));render();startTimer();
}function formatTime(ms){const total=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(total/60),s=total%60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function updateTimerDisplay(){const el=document.getElementById("timerDisplay");if(!el)return;const left=deadline?deadline-Date.now():TIME_LIMIT_MS;el.textContent=`⏱️ ${formatTime(left)}`;el.classList.toggle("urgent",left<=5*60*1000)}
function clearTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}sessionStorage.removeItem(TIMER_KEY)}
function startTimer(){if(timerHandle)clearInterval(timerHandle);const saved=Number(sessionStorage.getItem(TIMER_KEY)||0);if(saved)deadline=saved;if(!deadline){deadline=Date.now()+TIME_LIMIT_MS;sessionStorage.setItem(TIMER_KEY,String(deadline))}updateTimerDisplay();timerHandle=setInterval(()=>{const left=deadline-Date.now();updateTimerDisplay();if(left<=0){clearInterval(timerHandle);timerHandle=null;timeExpired=true;alert(lang==="en"?"Time is up. Your answers are locked and submitted automatically.":"Masa tamat. Jawapan telah dikunci dan dihantar secara automatik.");submitKT(true)}},1000)}
function toggleLang(){lang=lang==="ms"?"en":"ms";state.lang=lang;save();render()}function dash(){location.href="../index.html"}function kp10(){location.href="../kp/kp10.html"}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
const savedDeadline=Number(sessionStorage.getItem(TIMER_KEY)||0);
if(savedDeadline){deadline=savedDeadline;screen="quiz";if(deadline<=Date.now()){timeExpired=true;setTimeout(()=>submitKT(true),0)}else{setTimeout(startTimer,0)}}
render();
</script>
</body>
</html>
