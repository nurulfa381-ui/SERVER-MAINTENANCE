<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>KT04 · Alat Penyelenggaraan Server</title>
<style>
:root{--ink:#111827;--muted:#475569;--line:#111827;--soft:#cbd5e1;--blue:#1d4ed8;--green:#15803d;--red:#b91c1c;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:#e8eef5;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{width:min(1100px,calc(100% - 20px));margin:auto;padding:14px 0 40px}
.toolbar{position:sticky;top:8px;z-index:10;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;margin-bottom:16px;border-radius:14px;background:#0f172a;color:#fff}
.toolbar h1{margin:0;font-size:clamp(18px,2vw,26px)}.toolbar small{color:#cbd5e1}.toolbar button{padding:9px 13px;border:1px solid #ffffff45;border-radius:10px;background:#ffffff12;color:#fff;font-weight:700}
.paper{width:min(900px,100%);margin:auto;background:var(--paper);box-shadow:0 18px 45px #0f172a24}
.page{min-height:1120px;padding:24px 28px 34px}.official{border:1.5px solid var(--line)}
.college{display:grid;grid-template-columns:230px 1fr;min-height:240px}.logo{display:grid;place-items:center;padding:18px;border-right:1.5px solid var(--line)}
.logo img{width:min(185px,100%);max-height:175px;object-fit:contain}.fallback{display:none;text-align:center;font-weight:700;color:var(--muted)}
.college-info{display:flex;flex-direction:column;justify-content:center;padding:24px 28px}.college-info h2{margin:0;font-size:27px}.college-info p{margin:9px 0 0;font-size:18px;line-height:1.5;font-weight:700}
.doc-title{padding:18px;border-top:1.5px solid var(--line);text-align:center;font-size:29px;font-weight:800}
table{width:100%;border-collapse:collapse}th,td{border:1.5px solid var(--line);padding:13px 12px;vertical-align:top}th{width:255px;background:#f8fafc;text-align:left}
.code-row{display:grid;grid-template-columns:245px 1fr 240px}.code-row>div{min-height:70px;padding:13px;border:1.5px solid var(--line);border-top:0}
.section{margin-top:28px}.section h2{margin:0 0 14px;font-size:23px}.box{padding:17px 19px;border:1.5px solid var(--line);background:#f8fafc;line-height:1.75}
.progress{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#e2e8f0}
.bar{height:12px;overflow:hidden;border-radius:999px;background:#cbd5e1}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:.3s}
.question{margin:18px 0;padding:18px 20px;border:1.5px solid var(--soft);border-radius:10px}.qtext{font-size:17px;font-weight:700;line-height:1.55}
.options{display:grid;gap:10px}.option{display:flex;gap:10px;padding:12px 13px;border:1.5px solid var(--soft);border-radius:9px}.option:hover{border-color:var(--blue);background:#eff6ff}
select,textarea,input[type=number]{width:100%;padding:11px;border:1.5px solid #94a3b8;border-radius:8px}textarea{resize:vertical;line-height:1.6}
.assessor{margin-top:14px;padding:13px;background:#f8fafc;border:1px solid var(--soft);border-radius:9px}.assessor input{width:120px}
.assessor input:disabled,.assessor input[readonly]{background:#e2e8f0;color:#64748b;cursor:not-allowed;pointer-events:none}.assessor-lock{margin:18px 0;padding:16px;border:2px solid #f59e0b;border-radius:10px;background:#fffbeb;text-align:center}.assessor-lock button{margin-top:10px}
.submit,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}
.primary,.print,.danger{padding:13px 20px;border:0;border-radius:10px;color:#fff;font-weight:800}.primary{background:var(--blue)}.print{background:var(--green)}.danger{background:var(--red)}
.result{margin-top:24px;padding:22px;border:2px solid var(--line)}.score{display:grid;place-items:center;width:145px;height:145px;margin:18px auto;border:12px solid var(--blue);border-radius:50%;font-size:34px;font-weight:800}.score.ok{border-color:var(--green)}.score.no{border-color:var(--red)}
.status{padding:12px 18px;border:2px solid;text-align:center;font-size:24px;font-weight:800}.status.ok{border-color:var(--green);background:#f0fdf4;color:var(--green)}.status.no{border-color:var(--red);background:#fef2f2;color:var(--red)}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:54px}.line{margin-top:78px;border-top:1.5px solid var(--line);padding-top:8px;text-align:center;font-weight:700}
.alert{margin:16px 0;padding:13px 15px;border:1px solid #f59e0b;border-radius:9px;background:#fffbeb;color:#92400e;font-weight:700}
.lang-note{margin-bottom:16px;padding:10px 12px;border-radius:10px;background:#dbeafe;color:#1e3a8a;font-weight:700}
@media(max-width:760px){.toolbar{align-items:flex-start;flex-direction:column}.page{min-height:auto;padding:16px}.college{grid-template-columns:1fr}.logo{border-right:0;border-bottom:1.5px solid var(--line)}.college-info{text-align:center}.code-row{grid-template-columns:1fr}.sign{grid-template-columns:1fr}th{width:42%}}
@media print{@page{size:A4 portrait;margin:10mm}body{background:#fff}.shell{width:100%;padding:0}.toolbar,.progress,.submit,.actions,.lang-note{display:none!important}.paper{width:100%;box-shadow:none}.page{min-height:auto;padding:0}.result{margin-top:0}}
</style>
</head>
<body>
<main id="app"></main>
<script src="../storage.js"></script>
<script>
const app=document.getElementById("app");
if(!window.C05Storage)throw new Error("storage.js tidak ditemui");
let state=C05Storage.load();
if(!state.student){location.href="../index.html";throw new Error("Pelajar belum login")}
let lang=state.lang||"ms";
const name=state.student.name||"",studentId=state.student.id||"";
let resultReady=false,assessorUnlocked=false;

const TEXT={
ms:{
title:"Kertas Tugasan KT04",subtitle:"C05 – SERVER MAINTENANCE",dashboard:"Dashboard",fullscreen:"Skrin Penuh",language:"English",
program:"KOD DAN NAMA PROGRAM",level:"TAHAP",competency:"KOD DAN TAJUK UNIT KOMPETENSI",work:"NO. DAN PENYATAAN AKTIVITI KERJA",topic:"TAJUK",
student:"MAKLUMAT PELATIH",name:"NAMA PELATIH",id:"NO. KAD PENGENALAN",date:"TARIKH",mark:"MARKAH",instructions:"ARAHAN KEPADA CALON",
all:"Jawab semua soalan Bahagian A, B dan C.",progress:"Kemajuan Jawapan",partA:"BAHAGIAN A – SOALAN OBJEKTIF (10 MARKAH)",partB:"BAHAGIAN B – SOALAN PADANAN (5 MARKAH)",partC:"BAHAGIAN C – SOALAN JAWAPAN PENDEK (5 MARKAH)",
choose:"Pilih satu jawapan yang betul.",match:"Padankan alat dengan fungsi yang betul.",short:"Jawab semua soalan. Bahagian C tidak diberi markah oleh pelajar dan tidak dinilai secara automatik.",select:"-- Pilih jawapan --",type:"Taip jawapan di sini...",assessor:"Markah Pegawai Penilai",
submit:"HANTAR DAN KIRA MARKAH",missing:"Sila jawab semua soalan sebelum menghantar.",confirm:"Pastikan markah Bahagian C telah dimasukkan oleh Pegawai Penilai. Teruskan?",
result:"KEPUTUSAN KERTAS TUGASAN KT04",competent:"TERAMPIL",notCompetent:"BELUM TERAMPIL",print:"CETAK / SIMPAN PDF",repeat:"ULANG KT04",back:"KEMBALI KE DASHBOARD"
},
en:{
title:"Task Paper KT04",subtitle:"C05 – SERVER MAINTENANCE",dashboard:"Dashboard",fullscreen:"Fullscreen",language:"Bahasa Melayu",
program:"PROGRAM CODE AND NAME",level:"LEVEL",competency:"COMPETENCY UNIT CODE AND TITLE",work:"WORK ACTIVITY NO. AND STATEMENT",topic:"TITLE",
student:"TRAINEE INFORMATION",name:"TRAINEE NAME",id:"IDENTITY CARD NO.",date:"DATE",mark:"SCORE",instructions:"INSTRUCTIONS TO CANDIDATE",
all:"Answer all questions in Sections A, B and C.",progress:"Answer Progress",partA:"SECTION A – OBJECTIVE QUESTIONS (10 MARKS)",partB:"SECTION B – MATCHING QUESTIONS (5 MARKS)",partC:"SECTION C – SHORT ANSWER QUESTIONS (5 MARKS)",
choose:"Choose one correct answer.",match:"Match each tool with its correct function.",short:"Answer all questions. Section C is not scored by the student and is not graded automatically.",select:"-- Choose answer --",type:"Type your answer here...",assessor:"Assessor Mark",
submit:"SUBMIT AND CALCULATE SCORE",missing:"Please answer all questions before submitting.",confirm:"Ensure Section C marks have been entered by the Assessor. Continue?",
result:"KT04 TASK PAPER RESULT",competent:"COMPETENT",notCompetent:"NOT YET COMPETENT",print:"PRINT / SAVE PDF",repeat:"REPEAT KT04",back:"BACK TO DASHBOARD"
}
};
const tr=k=>TEXT[lang]?.[k]||TEXT.ms[k]||k;

const DATA={
code:"IT-020-3:2013-C05/KT(4/10)",
title:{ms:"Mengenalpasti Alat Penyelenggaraan Server",en:"Identifying Server Maintenance Tools"},
program:"IT-020-3:2013 COMPUTER SYSTEM OPERATION",
level:"3",
competency:"IT-020-3:2013-C05 SERVER MAINTENANCE",
totalMarks:20,passMark:60,
work:[
"ANALYSE SERVER MAINTENANCE JOB ORDER",
"CARRY OUT HARDWARE MAINTENANCE",
"PERFORM SERVER OPERATING SYSTEM MAINTENANCE",
"PREPARE SERVER MAINTENANCE REPORT"
],
instructions:{
ms:["Tuliskan nama dan nombor kad pengenalan calon pada ruangan yang disediakan.","Baca semua arahan dan soalan dengan teliti.","Jawab semua soalan dalam Bahagian A, B dan C.","Pastikan semua jawapan telah disemak sebelum dihantar."],
en:["Write the trainee name and identity card number in the spaces provided.","Read all instructions and questions carefully.","Answer all questions in Sections A, B and C.","Check all answers before submitting."]
},
objective:[
{id:"a1",ms:"Alat manakah digunakan untuk membuka skru casing server?",en:"Which tool is used to open server casing screws?",o:["Multimeter","Screwdriver Set","Cable Tester","External HDD"],a:1},
{id:"a2",ms:"Apakah fungsi utama multimeter?",en:"What is the main function of a multimeter?",o:["Menguji voltan dan kesinambungan","Membersihkan habuk","Menyimpan backup","Memasang RJ45"],a:0},
{id:"a3",ms:"Apakah fungsi ESD Wrist Strap?",en:"What is the function of an ESD Wrist Strap?",o:["Menguji kabel","Menerangi casing","Menyimpan data","Mencegah elektrik statik"],a:3},
{id:"a4",ms:"Alat manakah sesuai untuk menguji kabel rangkaian?",en:"Which tool is suitable for testing a network cable?",o:["Flashlight","Thermal Paste","Cable Tester","Mini Vacuum"],a:2},
{id:"a5",ms:"Apakah kegunaan thermal paste?",en:"What is thermal paste used for?",o:["Membersihkan habuk","Meningkatkan pemindahan haba CPU","Menguji voltan","Menyimpan backup"],a:1},
{id:"a6",ms:"Apakah fungsi external HDD dalam penyelenggaraan?",en:"What is the function of an external HDD in maintenance?",o:["Membuka casing","Menguji RJ45","Mengelakkan ESD","Membuat backup data"],a:3},
{id:"a7",ms:"Alat manakah digunakan untuk memasang penyambung RJ45?",en:"Which tool is used to attach an RJ45 connector?",o:["LAN Crimper","Anti-static Brush","Multimeter","Flashlight"],a:0},
{id:"a8",ms:"Apakah fungsi mini vacuum?",en:"What is the function of a mini vacuum?",o:["Menguji voltan","Menyimpan data","Mengeluarkan habuk","Memasang CPU"],a:2},
{id:"a9",ms:"Apakah kegunaan flashlight semasa penyelenggaraan?",en:"What is a flashlight used for during maintenance?",o:["Menguji kesinambungan","Menerangi ruang sempit","Membuat backup","Mencegah ESD"],a:1},
{id:"a10",ms:"Mengapakah alat anti-statik penting?",en:"Why are anti-static tools important?",o:["Menambah kelajuan rangkaian","Meningkatkan storan","Menukar IP","Mengelakkan kerosakan komponen akibat ESD"],a:3}
],
matching:{
items:[
["b1","Screwdriver Set","r1"],
["b2","Multimeter","r2"],
["b3","ESD Wrist Strap","r3"],
["b4","Cable Tester","r4"],
["b5","External HDD","r5"]
],
choices:{
ms:[
["r1","Membuka dan memasang skru casing server."],
["r2","Menguji voltan, rintangan dan kesinambungan."],
["r3","Mencegah kerosakan akibat elektrik statik."],
["r4","Menguji sambungan kabel rangkaian."],
["r5","Menyimpan backup sebelum penyelenggaraan."]
],
en:[
["r1","Opens and secures server casing screws."],
["r2","Tests voltage, resistance and continuity."],
["r3","Prevents electrostatic discharge damage."],
["r4","Tests network cable connections."],
["r5","Stores backups before maintenance."]
]
}
},
short:[
{id:"c1",ms:"Nyatakan dua alat yang digunakan untuk kerja penyelenggaraan server.",en:"State two tools used for server maintenance.",m:2,r:3},
{id:"c2",ms:"Terangkan fungsi ESD Wrist Strap.",en:"Explain the function of an ESD Wrist Strap.",m:1,r:2},
{id:"c3",ms:"Nyatakan dua langkah keselamatan semasa menggunakan alat penyelenggaraan.",en:"State two safety steps when using maintenance tools.",m:2,r:4}
]
};

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function header(){
return `<section class="official"><div class="college"><div class="logo"><img src="../assets/logo-mentari.jpg" alt="Logo Kolej Kemahiran Mentari" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback">LOGO KOLEJ KEMAHIRAN MENTARI</div></div><div class="college-info"><h2>KOLEJ KEMAHIRAN MENTARI (L02432)</h2><p>NO.22 & 24 GF, 1ST, 2ND & 3RD FLOOR<br>JALAN MERSING<br>86000 KLUANG<br>JOHOR</p></div></div><div class="doc-title">${tr("title")}</div></section>
<table><tr><th>${tr("program")}</th><td>${DATA.program}</td></tr><tr><th>${tr("level")}</th><td>${DATA.level}</td></tr><tr><th>${tr("competency")}</th><td>${DATA.competency}</td></tr><tr><th>${tr("work")}</th><td><ol>${DATA.work.map(x=>`<li>${x}</li>`).join("")}</ol></td></tr><tr><th>${tr("topic")}</th><td>${DATA.title[lang]}</td></tr></table>
<div class="code-row"><div><b>NO. KOD / CODE NO.</b></div><div>${DATA.code}</div><div><b>MUKA SURAT / PAGE: 1<br>DRPD / OF: 4</b></div></div>`;
}

function render(){
app.innerHTML=`<div class="shell"><header class="toolbar"><div><h1>📝 ${tr("title")}</h1><small>${tr("subtitle")}</small></div><div><button onclick="goDash()">← ${tr("dashboard")}</button><button onclick="toggleLang()">🌐 ${tr("language")}</button><button onclick="full()">⛶ ${tr("fullscreen")}</button></div></header>
<article class="paper"><section class="page">${header()}<div class="lang-note">${lang==="ms"?"Bahasa Melayu aktif":"English active"}</div>
<section class="section"><h2>${tr("student")}</h2><table><tr><th>${tr("name")}</th><td>${esc(name)}</td></tr><tr><th>${tr("id")}</th><td>${esc(studentId)}</td></tr><tr><th>${tr("date")}</th><td>__________________________</td></tr><tr><th>${tr("mark")}</th><td>__________________________</td></tr></table></section>
<section class="section"><h2>${tr("instructions")}</h2><div class="box"><ol>${DATA.instructions[lang].map(x=>`<li>${x}</li>`).join("")}</ol></div><div class="alert">${tr("all")}</div></section></section>
<section class="page"><div class="progress"><div><b>${tr("progress")}</b><div class="bar"><i id="bar"></i></div></div><b id="pct">0%</b></div>
<section class="section"><h2>${tr("partA")}</h2><div class="box">${tr("choose")}</div>${DATA.objective.map((q,i)=>`<article class="question"><b>${i+1}. (1 ${lang==="ms"?"Markah":"Mark"})</b><p class="qtext">${q[lang]}</p><div class="options">${q.o.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}" onchange="progress()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join("")}</div></article>`).join("")}</section>
<section class="section"><h2>${tr("partB")}</h2><div class="box">${tr("match")}</div>${DATA.matching.items.map((x,i)=>`<article class="question"><b>${i+1}. ${x[1]}</b><select id="${x[0]}" onchange="progress()"><option value="">${tr("select")}</option>${DATA.matching.choices[lang].map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}</select></article>`).join("")}</section></section>
<section class="page"><section class="section"><h2>${tr("partC")}</h2><div class="box">${tr("short")}</div><div class="assessor-lock"><b>📘 PENILAIAN KENDIRI / SELF-ASSESSMENT</b><br><span>Bahagian C ialah latihan ulang kaji. Pelajar hanya menaip jawapan; tiada ruangan markah untuk pelajar.</span></div>${DATA.short.map((q,i)=>`<article class="question"><b>${i+1}. (${q.m} ${lang==="ms"?"Markah":"Marks"})</b><p class="qtext">${q[lang]}</p><textarea id="${q.id}_a" rows="${q.r}" oninput="progress()" placeholder="${tr("type")}"></textarea></article>`).join("")}</section><div class="submit"><button class="primary" onclick="submitKT()">${tr("submit")}</button></div></section>
<section class="page hidden" id="result"></section></article></div>`;
}

function progress(){
let n=0,total=DATA.objective.length+DATA.matching.items.length+DATA.short.length;
DATA.objective.forEach(q=>{if(document.querySelector(`input[name="${q.id}"]:checked`))n++});
DATA.matching.items.forEach(x=>{if(document.getElementById(x[0]).value)n++});
DATA.short.forEach(q=>{if(document.getElementById(q.id+"_a").value.trim())n++});
let p=Math.round(n/total*100);document.getElementById("bar").style.width=p+"%";document.getElementById("pct").textContent=p+"%";
}
function limit(el,max){el.value=Math.max(0,Math.min(max,Number(el.value)||0))}
function unlockAssessor(){ alert("PIN tidak diperlukan. Bahagian C kini menggunakan penilaian kendiri untuk latihan."); }
function complete(){
  return DATA.objective.every(q=>document.querySelector(`input[name="${q.id}"]:checked`))
    && DATA.matching.items.every(x=>document.getElementById(x[0]).value)
    && DATA.short.every(q=>document.getElementById(q.id+"_a").value.trim());
}

function submitKT(){
if(!complete()){alert(tr("missing"));return}
let a=0,b=0;
DATA.objective.forEach(q=>{let s=document.querySelector(`input[name="${q.id}"]:checked`);if(Number(s.value)===q.a)a++});
DATA.matching.items.forEach(x=>{if(document.getElementById(x[0]).value===x[2])b++});
const total=a+b;
 const autoTotal=DATA.objective.length+DATA.matching.items.length;
 const pct=Math.round(total/autoTotal*100);
 const ok=true;
resultReady=true;
let r=document.getElementById("result");r.classList.remove("hidden");r.innerHTML=`${header()}<section class="result"><h2 style="text-align:center">${tr("result")}</h2><div class="score ${ok?"ok":"no"}">${pct}%</div><div class="status ${ok?"ok":"no"}">${lang==="ms"?"LATIHAN SELESAI":"PRACTICE COMPLETED"}</div><table style="margin-top:20px"><tr><th>${tr("name")}</th><td>${esc(name)}</td></tr><tr><th>${tr("id")}</th><td>${esc(studentId)}</td></tr><tr><th>${lang==="ms"?"BAHAGIAN A":"SECTION A"}</th><td>${a}/10</td></tr><tr><th>${lang==="ms"?"BAHAGIAN B":"SECTION B"}</th><td>${b}/5</td></tr><tr><th>${lang==="ms"?"BAHAGIAN C":"SECTION C"}</th><td>${lang==="ms"?"Tidak dinilai secara automatik":"Not graded automatically"}</td></tr><tr><th>${lang==="ms"?"JUMLAH MARKAH":"TOTAL SCORE"}</th><td>${total}/${autoTotal}</td></tr><tr><th>${lang==="ms"?"KEPUTUSAN":"RESULT"}</th><td><b>${lang==="ms"?"LATIHAN SELESAI":"PRACTICE COMPLETED"}</b></td></tr><tr><th>${tr("date")}</th><td>__________________________</td></tr></table><div class="sign"><div><b>${lang==="ms"?"NAMA PEGAWAI PENILAI":"ASSESSOR NAME"}</b><div class="line">${lang==="ms"?"Nama Pegawai Penilai":"Assessor Name"}</div></div><div><b>${lang==="ms"?"PENGESAHAN":"VERIFICATION"}</b><div class="line">${lang==="ms"?"Tandatangan Pegawai Penilai":"Assessor Signature"}</div></div></div></section><div class="actions"><button class="print" onclick="printKT()">🖨️ ${tr("print")}</button>${ok?`<button class="primary" onclick="location.href='../index.html'">${tr("back")}</button>`:`<button class="danger" onclick="location.reload()">${tr("repeat")}</button>`}</div>`;r.scrollIntoView({behavior:"smooth"});
try{C05Storage.saveKTResult(state,4,pct)}catch(e){console.warn("Keputusan KT04 dipaparkan tetapi rekod tidak dapat disimpan.",e)}
}
function toggleLang(){lang=lang==="ms"?"en":"ms";state.lang=lang;C05Storage.save(state);render()}
function printKT(){if(resultReady)window.print()}
function goDash(){if(confirm(lang==="ms"?"Kembali ke Dashboard? Jawapan yang belum dihantar tidak akan disimpan.":"Return to Dashboard? Unsaved answers will be lost."))location.href="../index.html"}
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
window.progress=progress;window.unlockAssessor=unlockAssessor;window.submitKT=submitKT;window.toggleLang=toggleLang;window.printKT=printKT;window.goDash=goDash;window.full=full;
render();
</script>
</body>
</html>
