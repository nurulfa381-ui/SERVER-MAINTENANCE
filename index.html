<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071a2d">

  <meta
    name="description"
    content="C05 Server Maintenance ialah sistem pembelajaran interaktif untuk pelajar SKM Tahap 3."
  >

  <title>C05 – Server Maintenance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css?v=6.3.0">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/favicon.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
</head>

<body>

  <noscript>
    <section class="noscript-message">
      JavaScript perlu diaktifkan untuk menggunakan sistem ini.
    </section>
  </noscript>

  <main id="app" aria-live="polite"></main>

  <!-- Sistem asal C05 -->
  <script src="storage.js?v=6.3.0"></script>
  <script src="text.js?v=6.3.0"></script>
  <script src="missions.js?v=6.3.0"></script>
  <script src="badges.js?v=6.3.0"></script>

  <!-- Firebase Sync -->
  <script src="firebase-sync.js?v=1.1.0"></script>
  <script type="module" src="firebase-config.js?v=1.1.0"></script>

  <script src="app.js?v=6.3.0"></script>

  <!-- Daftar PWA Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register(
            "./service-worker.js",
            { scope: "./" }
          );

          console.log(
            "SERVER MAINTENANCE PWA aktif:",
            registration.scope
          );

          await registration.update();
        } catch (error) {
          console.error(
            "Service Worker gagal didaftarkan:",
            error
          );
        }
      });
    }
  </script>

</body>
</html>
