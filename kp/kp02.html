<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06182c">
<title>KP02 · Mengenalpasti Penyelenggaraan Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020817;--bg2:#061a30;--panel:rgba(10,31,55,.92);--line:rgba(148,163,184,.22);--text:#f8fafc;--muted:#cbd5e1;--blue:#2563eb;--purple:#7c3aed;--orange:#f59e0b;--green:#16a34a;--red:#dc2626;--shadow:0 22px 65px rgba(0,0,0,.38)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Poppins,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(37,99,235,.28),transparent 30%),radial-gradient(circle at 90% 85%,rgba(124,58,237,.22),transparent 30%),linear-gradient(135deg,var(--bg),var(--bg2))}
button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{width:min(1500px,calc(100% - 28px));margin:auto;padding:16px 0 50px}
.header{position:sticky;top:10px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 18px;border:1px solid var(--line);border-radius:20px;background:rgba(2,12,25,.92);box-shadow:var(--shadow);backdrop-filter:blur(22px)}
.brand{display:flex;align-items:center;gap:14px}.logo{display:flex;align-items:center;justify-content:center;width:66px;height:66px;flex:0 0 66px;overflow:hidden;border:2px solid #ffffff52;border-radius:18px;background:#fff}.logo img{width:60px;height:60px;object-fit:contain;border-radius:13px}
.brand h1{margin:0;font-family:Montserrat,sans-serif;font-size:clamp(18px,2vw,29px)}.brand small{display:block;margin-top:4px;color:#60a5fa;font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#ffffff12;color:#fff;font-weight:800}
.progress-wrap{margin:18px 0;padding:14px 18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.progress-info{display:flex;justify-content:space-between;margin-bottom:9px;color:var(--muted);font-weight:800}.progress-info strong{color:#fde68a}.progress{height:15px;overflow:hidden;border-radius:999px;background:#020b16}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#facc15,var(--green));transition:.4s}
.stage{min-height:670px;display:grid;place-items:center;padding:clamp(20px,4vw,42px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(12,37,65,.94),rgba(4,18,34,.94));box-shadow:var(--shadow)}.slide{width:min(1080px,100%);animation:enter .4s ease}@keyframes enter{from{opacity:0;transform:translateY(20px)}}
.badge{display:inline-block;padding:9px 16px;border:1px solid #f59e0b73;border-radius:999px;background:#f59e0b26;color:#fde68a;font-weight:900}.hero{text-align:center}.hero .big{font-size:clamp(95px,13vw,165px);margin:18px 0}.hero h2,.title{font-family:Montserrat,sans-serif}.hero h2{font-size:clamp(36px,5.7vw,72px);margin:0 0 16px}.hero p,.lead{color:var(--muted);font-size:clamp(18px,2vw,24px);line-height:1.75}.title{font-size:clamp(30px,4vw,50px);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:25px}.card{min-height:210px;padding:23px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#ffffff16,#ffffff09);text-align:center}.card .icon{font-size:55px;margin-bottom:12px}.card h3{font-family:Montserrat,sans-serif;margin:0 0 9px}.card p{margin:0;color:var(--muted);line-height:1.65}
.checklist{display:grid;gap:12px;margin-top:22px}.check{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff0d}.check input{margin-top:4px;transform:scale(1.25)}.check.done{border-color:var(--green);background:#16a34a22}
.activity{padding:26px;border:1px solid var(--line);border-radius:22px;background:#ffffff0d}.question{font-family:Montserrat,sans-serif;font-size:clamp(21px,2.7vw,32px);font-weight:900;margin-bottom:20px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.answers button{min-height:68px;padding:16px 18px;border:1px solid var(--line);border-radius:15px;background:#ffffff0e;color:#fff;font-weight:800;text-align:left}.answers button.correct{border-color:#22c55e;background:#16a34a4d}.answers button.incorrect{border-color:#ef4444;background:#dc262633}.feedback{display:none;margin-top:16px;padding:15px;border-radius:14px;font-weight:800}.feedback.show{display:block}.feedback.good{background:#16a34a2e;color:#bbf7d0;border:1px solid #22c55e88}.feedback.bad{background:#dc26262b;color:#fecaca;border:1px solid #ef444480}
.summary{text-align:center}.summary .trophy{font-size:130px}.reward{display:inline-grid;grid-template-columns:repeat(3,auto);gap:18px;margin:23px 0;padding:19px 25px;border:1px solid #f59e0b59;border-radius:20px;background:#f59e0b1f}.reward div{min-width:125px}.reward span,.reward b{display:block}.reward span{color:var(--muted);font-size:13px}.reward b{color:#fde68a;font-size:27px}
.nav{display:flex;justify-content:space-between;gap:14px;margin-top:18px}.nav button{min-width:165px;padding:14px 21px;border:0;border-radius:14px;color:#fff;font-weight:900}.back{background:#ffffff17;border:1px solid var(--line)!important}.next{background:linear-gradient(135deg,var(--blue),var(--purple))}.kt{background:linear-gradient(135deg,var(--orange),#d97706);color:#111827!important}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.header{position:relative;flex-direction:column;align-items:flex-start}.tools{width:100%}.tools button{flex:1}.grid,.answers{grid-template-columns:1fr}.nav{flex-direction:column}.nav button{width:100%}}
</style>
</head>
<body>
<main id="app"></main>
<script src="../storage.js"></script>
<script>
const app=document.getElementById("app");
if(!window.C05Storage)throw new Error("storage.js tidak ditemui");
let state=C05Storage.load();
if(!state.student){location.href="../index.html";throw new Error("Pelajar belum login")}
const lang=state.lang||"ms";
let slide=0,activityDone=false;
const checks=new Set();
const T={
 ms:{title:"Mengenalpasti Penyelenggaraan Server",dash:"Dashboard",audio:"Audio",full:"Skrin Penuh",progress:"Kemajuan Pembelajaran",back:"KEMBALI",next:"SETERUSNYA",finish:"SELESAI KP02",toKT:"TERUSKAN KE KT02",need:"Lengkapkan semua semakan terlebih dahulu.",needAct:"Jawab aktiviti dengan betul dahulu.",correct:"Betul! Penyelenggaraan pencegahan dibuat secara berkala untuk mengelakkan kerosakan.",wrong:"Belum tepat. Cuba semula.",audioOn:"Audio diaktifkan.",audioOff:"Audio dimatikan."},
 en:{title:"Identifying Server Maintenance",dash:"Dashboard",audio:"Audio",full:"Fullscreen",progress:"Learning Progress",back:"BACK",next:"NEXT",finish:"COMPLETE KP02",toKT:"CONTINUE TO KT02",need:"Complete all checks first.",needAct:"Answer the activity correctly first.",correct:"Correct! Preventive maintenance is performed regularly to prevent failure.",wrong:"Not correct yet. Try again.",audioOn:"Audio enabled.",audioOff:"Audio disabled."}
};
const t=k=>T[lang]?.[k]||T.ms[k]||k;
const slides=[
 {type:"intro",ms:{badge:"MISI KEDUA",title:"Kenali Penyelenggaraan Server",lead:"Sebagai Juruteknik Pelatih, anda perlu mengenal pasti jenis, tujuan dan prosedur asas penyelenggaraan server."},en:{badge:"SECOND MISSION",title:"Understand Server Maintenance",lead:"As a Trainee Technician, you must identify the types, purposes and basic procedures of server maintenance."}},
 {type:"purpose",ms:{title:"Mengapa Server Perlu Diselenggara?",lead:"Penyelenggaraan memastikan server kekal stabil, selamat dan beroperasi dengan prestasi optimum."},en:{title:"Why Must Servers Be Maintained?",lead:"Maintenance keeps servers stable, secure and operating at optimum performance."}},
 {type:"types",ms:{title:"Jenis Penyelenggaraan",lead:"Tiga jenis utama perlu dikenal pasti."},en:{title:"Types of Maintenance",lead:"Three main types must be identified."}},
 {type:"schedule",ms:{title:"Jadual Penyelenggaraan",lead:"Kerja perlu dirancang mengikut kekerapan yang sesuai."},en:{title:"Maintenance Schedule",lead:"Tasks must be planned at suitable intervals."}},
 {type:"checklist",ms:{title:"Semakan Sebelum Penyelenggaraan",lead:"Tandakan semua perkara sebelum kerja dimulakan."},en:{title:"Pre-Maintenance Checks",lead:"Tick every item before work begins."}},
 {type:"safety",ms:{title:"Prosedur Selamat",lead:"Keselamatan pengguna, data dan peralatan mesti diutamakan."},en:{title:"Safe Procedure",lead:"User, data and equipment safety must come first."}},
 {type:"activity",correct:1,ms:{title:"Mini Aktiviti",q:"Apakah maksud penyelenggaraan pencegahan?",a:["Membaiki server selepas rosak","Melakukan pemeriksaan berkala untuk mencegah kerosakan","Menghapuskan semua data server","Menukar server pada setiap bulan"]},en:{title:"Mini Activity",q:"What is preventive maintenance?",a:["Repairing a server after failure","Performing regular checks to prevent failure","Deleting all server data","Replacing the server every month"]}},
 {type:"summary",ms:{title:"Ringkasan KP02",points:["Penyelenggaraan memastikan server stabil dan selamat.","Jenis utama ialah pencegahan, pembetulan dan ramalan.","Jadual kerja perlu direkodkan.","Backup dan keselamatan mesti dibuat sebelum penyelenggaraan."]},en:{title:"KP02 Summary",points:["Maintenance keeps servers stable and secure.","Main types are preventive, corrective and predictive.","Work schedules must be recorded.","Backup and safety checks are required before maintenance."]}},
 {type:"complete",ms:{title:"Misi KP02 Selesai",lead:"Anda telah mengenal pasti asas penyelenggaraan server. Seterusnya jawab KT02."},en:{title:"KP02 Mission Completed",lead:"You have identified the basics of server maintenance. Next, complete KT02."}}
];
function c(){return slides[slide][lang]||slides[slide].ms}
function card(icon,title,body){return `<article class="card"><div class="icon">${icon}</div><h3>${title}</h3><p>${body}</p></article>`}
function render(){
 const p=Math.round((slide+1)/slides.length*100);
 app.innerHTML=`<div class="shell"><header class="header"><div class="brand"><div class="logo"><img src="../assets/logo-mentari.jpg" alt="Logo Kolej Kemahiran Mentari" onerror="this.style.display='none';this.parentElement.textContent='🏫'"></div><div><h1>KP02 · ${t("title")}</h1><small>C05 – SERVER MAINTENANCE</small></div></div><div class="tools"><button onclick="dash()">← ${t("dash")}</button><button onclick="audio()">${state.audio?"🔊":"🔇"} ${t("audio")}</button><button onclick="full()">⛶ ${t("full")}</button></div></header><section class="progress-wrap"><div class="progress-info"><span>${t("progress")}</span><strong>${p}%</strong></div><div class="progress"><i style="width:${p}%"></i></div></section><section class="stage">${view()}</section>${nav()}</div>`;
}
function view(){
 const x=c(),type=slides[slide].type;
 if(type==="intro")return `<article class="slide hero"><div class="badge">${x.badge}</div><div class="big">🧰</div><h2>${x.title}</h2><p>${x.lead}</p></article>`;
 if(type==="purpose")return `<article class="slide"><h2 class="title">🎯 ${x.title}</h2><p class="lead">${x.lead}</p><div class="grid">${card("⚡",lang==="ms"?"Prestasi":"Performance",lang==="ms"?"Mengurangkan gangguan dan kelembapan.":"Reduces downtime and slowness.")}${card("🔐",lang==="ms"?"Keselamatan":"Security",lang==="ms"?"Mengurangkan risiko ancaman dan kehilangan data.":"Reduces threats and data loss.")}${card("💰",lang==="ms"?"Kos":"Cost",lang==="ms"?"Mencegah kerosakan besar dan kos pembaikan tinggi.":"Prevents major damage and high repair costs.")}</div></article>`;
 if(type==="types")return `<article class="slide"><h2 class="title">🧩 ${x.title}</h2><p class="lead">${x.lead}</p><div class="grid">${card("🛡️",lang==="ms"?"Pencegahan":"Preventive",lang==="ms"?"Pemeriksaan berkala sebelum kerosakan berlaku.":"Regular checks before failure occurs.")}${card("🔧",lang==="ms"?"Pembetulan":"Corrective",lang==="ms"?"Membaiki masalah selepas kerosakan dikenal pasti.":"Repairs a fault after it is identified.")}${card("📊",lang==="ms"?"Ramalan":"Predictive",lang==="ms"?"Menggunakan data prestasi untuk meramal kerosakan.":"Uses performance data to predict failure.")}</div></article>`;
 if(type==="schedule")return `<article class="slide"><h2 class="title">📅 ${x.title}</h2><p class="lead">${x.lead}</p><div class="grid">${card("☀️",lang==="ms"?"Harian":"Daily",lang==="ms"?"Semak log, amaran dan status backup.":"Check logs, alerts and backup status.")}${card("🗓️",lang==="ms"?"Mingguan":"Weekly",lang==="ms"?"Semak ruang storan, suhu dan penggunaan sumber.":"Check storage, temperature and resource usage.")}${card("📆",lang==="ms"?"Bulanan":"Monthly",lang==="ms"?"Lakukan kemas kini, ujian pemulihan dan pemeriksaan fizikal.":"Perform updates, recovery tests and physical inspection.")}</div></article>`;
 if(type==="checklist"){
  const items=lang==="ms"?["Semak arahan kerja","Maklumkan pengguna tentang downtime","Pastikan backup terkini berjaya","Sediakan peralatan dan PPE","Rekod keadaan awal server"]:["Check the job order","Notify users about downtime","Confirm the latest backup succeeded","Prepare tools and PPE","Record the initial server condition"];
  return `<article class="slide"><h2 class="title">✅ ${x.title}</h2><p class="lead">${x.lead}</p><div class="checklist">${items.map((v,i)=>`<label class="check ${checks.has(i)?"done":""}"><input type="checkbox" ${checks.has(i)?"checked":""} onchange="toggleCheck(${i},this.checked)"><span>${v}</span></label>`).join("")}</div>${checks.size===items.length?'<div class="feedback show good">'+(lang==="ms"?"Semua semakan telah lengkap.":"All checks are complete.")+"</div>":""}</article>`;
 }
 if(type==="safety")return `<article class="slide"><h2 class="title">🦺 ${x.title}</h2><p class="lead">${x.lead}</p><div class="grid">${card("💾",lang==="ms"?"Backup":"Backup",lang==="ms"?"Pastikan data boleh dipulihkan.":"Ensure data can be restored.")}${card("⚡",lang==="ms"?"Kuasa":"Power",lang==="ms"?"Gunakan prosedur shutdown dan pengasingan kuasa yang betul.":"Use correct shutdown and power isolation procedures.")}${card("📝",lang==="ms"?"Dokumentasi":"Documentation",lang==="ms"?"Catat semua tindakan dan perubahan.":"Record all actions and changes.")}</div></article>`;
 if(type==="activity")return `<article class="slide"><h2 class="title">🎮 ${x.title}</h2><div class="activity"><div class="question">${x.q}</div><div class="answers">${x.a.map((v,i)=>`<button onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${v}</button>`).join("")}</div><div class="feedback" id="fb"></div></div></article>`;
 if(type==="summary")return `<article class="slide"><h2 class="title">🧠 ${x.title}</h2><div class="grid">${x.points.map((v,i)=>card(["🧰","🛡️","📅","💾"][i],String(i+1),v)).join("")}</div></article>`;
 return `<article class="slide summary"><div class="trophy">🏆</div><h2 class="title">${x.title}</h2><p class="lead">${x.lead}</p><div class="reward"><div><span>XP</span><b>+100</b></div><div><span>${lang==="ms"?"Syiling":"Coins"}</span><b>+50</b></div><div><span>${lang==="ms"?"Lencana":"Badge"}</span><b>🧰</b></div></div></article>`;
}
function nav(){
 const first=slide===0,last=slide===slides.length-1;
 return `<nav class="nav"><button class="back" onclick="prev()" ${first?"disabled":""}>← ${t("back")}</button>${last?`<button class="kt" onclick="toKT()">${t("toKT")} →</button>`:`<button class="next" onclick="next()">${slide===slides.length-2?t("finish"):t("next")} →</button>`}</nav>`;
}
function next(){
 const type=slides[slide].type;
 if(type==="checklist"&&checks.size<5){alert(t("need"));return}
 if(type==="activity"&&!activityDone){alert(t("needAct"));return}
 if(slide<slides.length-1){slide++;render();scrollTo({top:0,behavior:"smooth"})}
}
function prev(){if(slide>0){slide--;render();scrollTo({top:0,behavior:"smooth"})}}
function toggleCheck(i,on){on?checks.add(i):checks.delete(i);render()}
function answer(i,btn){
 document.querySelectorAll(".answers button").forEach(b=>b.classList.remove("correct","incorrect"));
 const fb=document.getElementById("fb");
 if(i===1){btn.classList.add("correct");fb.className="feedback show good";fb.textContent=t("correct");activityDone=true;beep(880)}
 else{btn.classList.add("incorrect");fb.className="feedback show bad";fb.textContent=t("wrong");activityDone=false;beep(220)}
}
function completeKP02(){
 const done=Array.isArray(state.completedKP)?state.completedKP:[];
 const already=done.includes(2);
 C05Storage.completeKP(state,2);
 if(!already){state.xp=(state.xp||0)+100;state.coins=(state.coins||0)+50;if(!Array.isArray(state.badges))state.badges=[];if(!state.badges.includes("kp02-complete"))state.badges.push("kp02-complete")}
 C05Storage.save(state);
}
function toKT(){completeKP02();location.href="../kt/kt02.html"}
function dash(){location.href="../index.html"}
function audio(){state.audio=!state.audio;C05Storage.save(state);alert(state.audio?t("audioOn"):t("audioOff"));render()}
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function beep(f){if(!state.audio)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.stop(c.currentTime+.18)}catch(e){}}
window.next=next;window.prev=prev;window.toggleCheck=toggleCheck;window.answer=answer;window.toKT=toKT;window.dash=dash;window.audio=audio;window.full=full;
render();
</script>
</body>
</html>
