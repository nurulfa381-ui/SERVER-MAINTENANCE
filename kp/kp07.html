<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2d">
<title>KP07 · Konfigurasi DNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020817;--bg2:#071a2d;--panel:rgba(10,31,55,.92);--line:rgba(148,163,184,.22);--text:#f8fafc;--muted:#cbd5e1;--blue:#2563eb;--purple:#7c3aed;--orange:#f59e0b;--green:#16a34a;--red:#dc2626;--shadow:0 22px 65px rgba(0,0,0,.38)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Poppins,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(37,99,235,.28),transparent 30%),radial-gradient(circle at 90% 85%,rgba(124,58,237,.22),transparent 30%),linear-gradient(135deg,var(--bg),var(--bg2))}
button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{width:min(1500px,calc(100% - 28px));margin:auto;padding:16px 0 50px}
.header{position:sticky;top:10px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 18px;border:1px solid var(--line);border-radius:20px;background:rgba(2,12,25,.92);box-shadow:var(--shadow);backdrop-filter:blur(22px)}
.brand{display:flex;align-items:center;gap:14px}.logo{display:flex;align-items:center;justify-content:center;width:66px;height:66px;flex:0 0 66px;overflow:hidden;border:2px solid #ffffff52;border-radius:18px;background:#fff}.logo img{width:60px;height:60px;object-fit:contain;border-radius:13px}
.brand h1{margin:0;font-family:Montserrat,sans-serif;font-size:clamp(18px,2vw,29px)}.brand small{display:block;margin-top:4px;color:#60a5fa;font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#ffffff12;color:#fff;font-weight:800}
.progress-wrap{margin:18px 0;padding:14px 18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.progress-info{display:flex;justify-content:space-between;margin-bottom:9px;color:var(--muted);font-weight:800}.progress-info strong{color:#fde68a}.progress{height:15px;overflow:hidden;border-radius:999px;background:#020b16}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#facc15,var(--green));transition:.4s}
.stage{min-height:680px;display:grid;place-items:center;padding:clamp(20px,4vw,42px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(12,37,65,.94),rgba(4,18,34,.94));box-shadow:var(--shadow)}.slide{width:min(1120px,100%);animation:enter .4s ease}@keyframes enter{from{opacity:0;transform:translateY(20px)}}
.hero{text-align:center}.badge{display:inline-block;padding:9px 16px;border:1px solid #f59e0b73;border-radius:999px;background:#f59e0b26;color:#fde68a;font-weight:900}.hero .big{font-size:clamp(95px,13vw,165px);margin:18px 0}.hero h2,.title{font-family:Montserrat,sans-serif}.hero h2{font-size:clamp(36px,5.7vw,72px);margin:0 0 16px}.hero p,.lead{color:var(--muted);font-size:clamp(18px,2vw,24px);line-height:1.75}.title{font-size:clamp(30px,4vw,50px);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:25px}.tool-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:24px}.card,.tool{padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#ffffff16,#ffffff09);text-align:center}.card{min-height:210px}.tool{min-height:180px;color:#fff}.tool.done{border-color:var(--green);background:#16a34a22}.tool .icon,.card .icon{font-size:52px;margin-bottom:10px}.tool small,.card p{display:block;margin-top:8px;color:var(--muted);line-height:1.55}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.match-card{padding:18px;border:1px solid var(--line);border-radius:16px;background:#ffffff0d}.match-card select{width:100%;margin-top:10px;padding:11px;border-radius:9px}
.toolbox{display:grid;gap:14px;margin-top:22px}.scenario{padding:18px;border:1px solid var(--line);border-radius:16px;background:#ffffff0d}.scenario h3{margin-top:0}.choices{display:flex;gap:10px;flex-wrap:wrap}.choices button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#ffffff12;color:#fff;font-weight:700}.choices button.good{background:#16a34a44;border-color:#22c55e}.choices button.bad{background:#dc262633;border-color:#ef4444}
.quiz-q{margin:16px 0;padding:18px;border:1px solid var(--line);border-radius:16px;background:#ffffff0d}.quiz-q h3{margin-top:0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{padding:13px;border:1px solid var(--line);border-radius:10px;background:#ffffff12;color:#fff;text-align:left}.answers button.correct{background:#16a34a44;border-color:#22c55e}.answers button.incorrect{background:#dc262633;border-color:#ef4444}
.feedback{display:none;margin-top:16px;padding:15px;border-radius:14px;font-weight:800}.feedback.show{display:block}.feedback.good{background:#16a34a2e;color:#bbf7d0;border:1px solid #22c55e88}.feedback.bad{background:#dc26262b;color:#fecaca;border:1px solid #ef444480}
.summary{text-align:center}.summary .trophy{font-size:130px}.reward{display:inline-grid;grid-template-columns:repeat(3,auto);gap:18px;margin:23px 0;padding:19px 25px;border:1px solid #f59e0b59;border-radius:20px;background:#f59e0b1f}.reward div{min-width:125px}.reward span,.reward b{display:block}.reward span{color:var(--muted);font-size:13px}.reward b{color:#fde68a;font-size:27px}
.nav{display:flex;justify-content:space-between;gap:14px;margin-top:18px}.nav button{min-width:165px;padding:14px 21px;border:0;border-radius:14px;color:#fff;font-weight:900}.back{background:#ffffff17;border:1px solid var(--line)!important}.next{background:linear-gradient(135deg,var(--blue),var(--purple))}.kt{background:linear-gradient(135deg,var(--orange),#d97706);color:#111827!important}
.byte{position:fixed;right:20px;bottom:20px;z-index:40}.byte button{width:68px;height:68px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:30px;box-shadow:var(--shadow)}.byte-tip{position:absolute;right:0;bottom:80px;width:min(340px,calc(100vw - 35px));display:none;padding:16px;border:1px solid var(--line);border-radius:16px;background:#081b30;line-height:1.6}.byte-tip.show{display:block}
@media(max-width:1050px){.tool-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.grid,.match-grid,.answers{grid-template-columns:1fr 1fr}}@media(max-width:700px){.header{position:relative;flex-direction:column;align-items:flex-start}.tools{width:100%}.tools button{flex:1}.grid,.tool-grid,.match-grid,.answers{grid-template-columns:1fr}.nav{flex-direction:column}.nav button{width:100%}}
</style>
</head>
<body>
<main id="app"></main>
<script src="../storage.js"></script>
<script>
const app=document.getElementById("app");
if(!window.C05Storage)throw new Error("storage.js tidak ditemui");
let state=C05Storage.load();
if(!state.student){location.href="../index.html";throw new Error("Pelajar belum login")}
const requiredKT=6;
const requiredKey=`kt${String(requiredKT).padStart(2,"0")}`;
const requiredScore=Number(state.ktBestScores?.[requiredKey]??state.ktScores?.[requiredKey]??state.ktScores?.[String(requiredKT)]??0);
if(requiredScore<60){
 alert((state.lang||"ms")==="en"?`KP07 is locked. Pass KT06 with at least 60% first.`:`KP07 dikunci. Lulus KT06 sekurang-kurangnya 60% dahulu.`);
 location.href="../index.html";
 throw new Error("KP07 locked");
}
let lang=state.lang||"ms",slide=0;
const explored=new Set(),matchAnswers={},scenarioDone=new Set(),quizAnswers={};
const T={
 ms:{title:"Konfigurasi DNS",dash:"Dashboard",audio:"Audio",full:"Skrin Penuh",lang:"English",progress:"Kemajuan Pembelajaran",back:"KEMBALI",next:"SETERUSNYA",finish:"SELESAI KP07",toKT:"TERUSKAN KE KT07",needTools:"Klik semua komponen DNS terlebih dahulu.",needMatch:"Lengkapkan semua padanan komponen DNS dengan betul.",needScenario:"Selesaikan semua situasi konfigurasi DNS.",needQuiz:"Jawab semua soalan Boss Challenge.",helper:"Hai Agent! Terokai komponen DNS, bina zon dan rekod dengan betul, kemudian uji resolusi nama sebelum ke KT07."},
 en:{title:"DNS Configuration",dash:"Dashboard",audio:"Audio",full:"Fullscreen",lang:"Bahasa Melayu",progress:"Learning Progress",back:"BACK",next:"NEXT",finish:"COMPLETE KP07",toKT:"CONTINUE TO KT07",needTools:"Click all DNS components first.",needMatch:"Complete all DNS component matches correctly.",needScenario:"Complete all DNS configuration scenarios.",needQuiz:"Answer all Boss Challenge questions.",helper:"Hi Agent! Explore DNS components, configure zones and records correctly, then test name resolution before KT07."}
};
const tr=k=>T[lang]?.[k]||T.ms[k]||k;
const tools=[
 ["role","🧩","DNS Server Role","Peranan DNS Server","Memasang perkhidmatan DNS pada Windows Server.","Installs DNS services on Windows Server."],
 ["forward","➡️","Forward Lookup Zone","Zon Carian Hadapan","Menukarkan nama hos kepada alamat IP.","Resolves host names to IP addresses."],
 ["reverse","⬅️","Reverse Lookup Zone","Zon Carian Songsang","Menukarkan alamat IP kepada nama hos.","Resolves IP addresses to host names."],
 ["arecord","🅰️","A Record","Rekod A","Memetakan nama hos IPv4 kepada alamat IP.","Maps an IPv4 host name to an IP address."],
 ["ptr","📍","PTR Record","Rekod PTR","Memetakan alamat IP kepada nama hos.","Maps an IP address to a host name."],
 ["cname","🏷️","CNAME Record","Rekod CNAME","Mencipta nama alias bagi hos kanonikal.","Creates an alias for a canonical host."],
 ["mx","✉️","MX Record","Rekod MX","Menentukan server mel bagi sesuatu domain.","Specifies the mail server for a domain."],
 ["forwarder","🌐","DNS Forwarder","DNS Forwarder","Menghantar pertanyaan luar kepada DNS lain.","Forwards external queries to another DNS server."],
 ["cache","⚡","DNS Cache","Cache DNS","Menyimpan jawapan sementara untuk carian lebih pantas.","Stores temporary answers for faster lookups."],
 ["nslookup","🔎","nslookup","nslookup","Menguji resolusi nama dan respons server DNS.","Tests name resolution and DNS server responses."]
];
const slides=[
 {type:"intro",ms:{badge:"MISI KETUJUH",title:"Kuasai Konfigurasi DNS",lead:"Pasang DNS Server, bina zon carian, tambah rekod dan sahkan resolusi nama."},en:{badge:"SEVENTH MISSION",title:"Master DNS Configuration",lead:"Install DNS Server, create lookup zones, add records and verify name resolution."}},
 {type:"learn",ms:{title:"10 Komponen Utama DNS",lead:"Klik semua komponen untuk memahami fungsi DNS pada Windows Server."},en:{title:"10 Core DNS Components",lead:"Click every component to understand DNS functions in Windows Server."}},
 {type:"match",ms:{title:"Padankan Komponen DNS",lead:"Pilih fungsi yang betul bagi setiap komponen DNS."},en:{title:"Match DNS Components",lead:"Choose the correct function for each DNS component."}},
 {type:"toolbox",ms:{title:"Pilih Tindakan Konfigurasi",lead:"Pilih komponen paling sesuai bagi setiap situasi DNS."},en:{title:"Choose Configuration Actions",lead:"Choose the most suitable component for each DNS scenario."}},
 {type:"quiz",ms:{title:"Boss Challenge",lead:"Jawab semua soalan untuk menamatkan KP07."},en:{title:"Boss Challenge",lead:"Answer all questions to complete KP07."}},
 {type:"summary",ms:{title:"Ringkasan KP07",lead:"Pasang DNS Server, cipta zon hadapan dan songsang, tambah rekod, tetapkan forwarder serta uji menggunakan nslookup."},en:{title:"KP07 Summary",lead:"Install DNS Server, create forward and reverse zones, add records, configure a forwarder and test with nslookup."}},
 {type:"complete",ms:{title:"Misi KP07 Selesai",lead:"Anda telah menguasai asas konfigurasi DNS. Seterusnya jawab KT07."},en:{title:"KP07 Mission Completed",lead:"You have mastered the fundamentals of DNS configuration. Next, complete KT07."}}
];
function c(){return slides[slide][lang]||slides[slide].ms}
function render(){
 const p=Math.round((slide+1)/slides.length*100);
 app.innerHTML=`<div class="shell"><header class="header"><div class="brand"><div class="logo"><img src="../assets/logo-mentari.jpg" alt="Logo Kolej Kemahiran Mentari" onerror="this.style.display='none';this.parentElement.textContent='🏫'"></div><div><h1>KP07 · ${tr("title")}</h1><small>C05 – SERVER MAINTENANCE</small></div></div><div class="tools"><button onclick="dash()">← ${tr("dash")}</button><button onclick="toggleLang()">🌐 ${tr("lang")}</button><button onclick="audio()">${state.audio?"🔊":"🔇"} ${tr("audio")}</button><button onclick="full()">⛶ ${tr("full")}</button></div></header><section class="progress-wrap"><div class="progress-info"><span>${tr("progress")}</span><strong>${p}%</strong></div><div class="progress"><i style="width:${p}%"></i></div></section><section class="stage">${view()}</section>${nav()}</div><div class="byte"><button onclick="byte()">🤖</button><div class="byte-tip" id="byteTip">${tr("helper")}</div></div>`;
}
function view(){
 const x=c(),type=slides[slide].type;
 if(type==="intro")return `<article class="slide hero"><div class="badge">${x.badge}</div><div class="big">🌐</div><h2>${x.title}</h2><p>${x.lead}</p></article>`;
 if(type==="learn")return `<article class="slide"><h2 class="title">🧩 ${x.title}</h2><p class="lead">${x.lead}</p><div class="tool-grid">${tools.map(v=>`<button class="tool ${explored.has(v[0])?"done":""}" onclick="explore('${v[0]}')"><div class="icon">${v[1]}</div><strong>${lang==="ms"?v[3]:v[2]}</strong><small>${explored.has(v[0])?(lang==="ms"?v[4]:v[5]):(lang==="ms"?"Klik untuk belajar":"Click to learn")}</small></button>`).join("")}</div>${explored.size===tools.length?`<div class="feedback show good">${lang==="ms"?"Semua komponen DNS telah diterokai.":"All DNS components have been explored."}</div>`:""}</article>`;
 if(type==="match"){
  const picks=[tools[1],tools[2],tools[3],tools[4]];
  return `<article class="slide"><h2 class="title">🧩 ${x.title}</h2><p class="lead">${x.lead}</p><div class="match-grid">${picks.map(v=>`<div class="match-card"><strong>${lang==="ms"?v[3]:v[2]}</strong><select onchange="match('${v[0]}',this.value)"><option value="">-- ${lang==="ms"?"Pilih fungsi":"Choose function"} --</option>${picks.map(o=>`<option value="${o[0]}" ${matchAnswers[v[0]]===o[0]?"selected":""}>${lang==="ms"?o[4]:o[5]}</option>`).join("")}</select></div>`).join("")}</div>${Object.keys(matchAnswers).length===4?`<div class="feedback show ${Object.entries(matchAnswers).every(([k,v])=>k===v)?"good":"bad"}">${Object.entries(matchAnswers).every(([k,v])=>k===v)?(lang==="ms"?"Semua padanan betul.":"All matches are correct."):(lang==="ms"?"Ada padanan yang salah.":"Some matches are incorrect.")}</div>`:""}</article>`;
 }
 if(type==="toolbox"){
  const scenarios=[
   ["host",lang==="ms"?"Memetakan server01 kepada 192.168.10.10":"Mapping server01 to 192.168.10.10",["arecord","ptr","mx"],"arecord"],
   ["reverseq",lang==="ms"?"Mencari nama hos daripada alamat IP":"Finding a host name from an IP address",["ptr","cname","cache"],"ptr"],
   ["external",lang==="ms"?"Menghantar pertanyaan internet kepada DNS awam":"Sending internet queries to a public DNS server",["forwarder","forward","nslookup"],"forwarder"]
  ];
  return `<article class="slide"><h2 class="title">🎒 ${x.title}</h2><p class="lead">${x.lead}</p><div class="toolbox">${scenarios.map(s=>`<div class="scenario"><h3>${s[1]}</h3><div class="choices">${s[2].map(id=>{const v=tools.find(t=>t[0]===id);return `<button class="${scenarioDone.has(s[0])&&id===s[3]?"good":""}" onclick="scenario('${s[0]}','${id}','${s[3]}',this)">${v[1]} ${lang==="ms"?v[3]:v[2]}</button>`}).join("")}</div></div>`).join("")}</div>${scenarioDone.size===3?`<div class="feedback show good">${lang==="ms"?"Semua situasi selesai.":"All scenarios completed."}</div>`:""}</article>`;
 }
 if(type==="quiz"){
  const qs=[
   ["q1",lang==="ms"?"Zon yang menukar nama hos kepada alamat IP?":"Zone that resolves host names to IP addresses?",["forward","reverse","cache"],"forward"],
   ["q2",lang==="ms"?"Rekod yang memetakan nama hos IPv4 kepada alamat IP?":"Record that maps an IPv4 host name to an IP address?",["arecord","ptr","mx"],"arecord"],
   ["q3",lang==="ms"?"Rekod yang digunakan dalam zon carian songsang?":"Record used in a reverse lookup zone?",["ptr","cname","arecord"],"ptr"],
   ["q4",lang==="ms"?"Komponen yang menghantar pertanyaan luar kepada DNS lain?":"Component that sends external queries to another DNS server?",["forwarder","forward","cache"],"forwarder"],
   ["q5",lang==="ms"?"Arahan untuk menguji resolusi DNS?":"Command used to test DNS resolution?",["nslookup","mx","role"],"nslookup"]
  ];
  return `<article class="slide"><h2 class="title">👑 ${x.title}</h2><p class="lead">${x.lead}</p>${qs.map(q=>`<div class="quiz-q"><h3>${q[1]}</h3><div class="answers">${q[2].map(id=>{const v=tools.find(t=>t[0]===id);return `<button class="${quizAnswers[q[0]]===id?(id===q[3]?"correct":"incorrect"):""}" onclick="quiz('${q[0]}','${id}','${q[3]}',this)">${v[1]} ${lang==="ms"?v[3]:v[2]}</button>`}).join("")}</div></div>`).join("")}${Object.keys(quizAnswers).length===5?`<div class="feedback show ${Object.entries(quizAnswers).filter(([qid,val])=>{const q=qs.find(x=>x[0]===qid);return q&&q[3]===val}).length>=3?"good":"bad"}">${lang==="ms"?"Skor Cabaran Akhir: ":"Boss Challenge score: "}${Object.entries(quizAnswers).filter(([qid,val])=>{const q=qs.find(x=>x[0]===qid);return q&&q[3]===val}).length}/5</div>`:""}</article>`;
 }
 if(type==="summary")return `<article class="slide summary"><div class="trophy">🌐</div><h2 class="title">${x.title}</h2><p class="lead">${x.lead}</p><div class="reward"><div><span>XP</span><b>+150</b></div><div><span>${lang==="ms"?"Syiling":"Coins"}</span><b>+75</b></div><div><span>${lang==="ms"?"Lencana":"Badge"}</span><b>🔎</b></div></div></article>`;
 return `<article class="slide summary"><div class="trophy">🏆</div><h2 class="title">${x.title}</h2><p class="lead">${x.lead}</p></article>`;
}
function nav(){
 const first=slide===0,last=slide===slides.length-1;
 return `<nav class="nav"><button class="back" onclick="prev()" ${first?"disabled":""}>← ${tr("back")}</button>${last?`<button class="kt" onclick="toKT()">${tr("toKT")} →</button>`:`<button class="next" onclick="next()">${slide===slides.length-2?tr("finish"):tr("next")} →</button>`}</nav>`;
}
function next(){
 const type=slides[slide].type;
 if(type==="learn"&&explored.size<tools.length){alert(tr("needTools"));return}
 if(type==="match"&&!(Object.keys(matchAnswers).length===4&&Object.entries(matchAnswers).every(([k,v])=>k===v))){alert(tr("needMatch"));return}
 if(type==="toolbox"&&scenarioDone.size<3){alert(tr("needScenario"));return}
 if(type==="quiz"&&Object.keys(quizAnswers).length<5){alert(tr("needQuiz"));return}
 if(slide<slides.length-1){slide++;render();scrollTo({top:0,behavior:"smooth"})}
}
function prev(){if(slide>0){slide--;render();scrollTo({top:0,behavior:"smooth"})}}
function explore(id){explored.add(id);beep(660);render()}
function match(id,value){matchAnswers[id]=value;render()}
function scenario(group,id,correct,btn){if(id===correct){scenarioDone.add(group);beep(880)}else{beep(220)}render()}
function quiz(q,id,correct,btn){quizAnswers[q]=id;beep(id===correct?880:220);render()}
function toggleLang(){lang=lang==="ms"?"en":"ms";state.lang=lang;C05Storage.save(state);render()}
function byte(){document.getElementById("byteTip")?.classList.toggle("show")}
function completeKP07(){
 const done=Array.isArray(state.completedKP)?state.completedKP:[];
 const already=done.includes(6);
 C05Storage.completeKP(state,6);
 if(!already){
   state.xp=(state.xp||0)+150;
   state.coins=(state.coins||0)+75;
   if(!Array.isArray(state.badges))state.badges=[];
   if(!state.badges.includes("kp07-complete"))state.badges.push("kp07-complete");
 }
 C05Storage.save(state);
}
function toKT(){completeKP07();location.href="../kt/kt07.html"}
function dash(){location.href="../index.html"}
function audio(){state.audio=!state.audio;C05Storage.save(state);render()}
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function beep(f){if(!state.audio)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.stop(c.currentTime+.18)}catch(e){}}
window.next=next;window.prev=prev;window.explore=explore;window.match=match;window.scenario=scenario;window.quiz=quiz;window.toggleLang=toggleLang;window.byte=byte;window.toKT=toKT;window.dash=dash;window.audio=audio;window.full=full;
render();
</script>
</body>
</html>
