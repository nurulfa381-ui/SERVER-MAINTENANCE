<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06182c">
<title>KP03 · Keselamatan Bilik Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020817;--bg2:#061a30;--panel:rgba(10,31,55,.92);--line:rgba(148,163,184,.22);--text:#f8fafc;--muted:#cbd5e1;--blue:#2563eb;--purple:#7c3aed;--orange:#f59e0b;--green:#16a34a;--red:#dc2626;--shadow:0 22px 65px rgba(0,0,0,.38)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Poppins,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(37,99,235,.28),transparent 30%),radial-gradient(circle at 90% 85%,rgba(124,58,237,.22),transparent 30%),linear-gradient(135deg,var(--bg),var(--bg2))}
button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{width:min(1500px,calc(100% - 28px));margin:auto;padding:16px 0 50px}
.header{position:sticky;top:10px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 18px;border:1px solid var(--line);border-radius:20px;background:rgba(2,12,25,.92);box-shadow:var(--shadow);backdrop-filter:blur(22px)}
.brand{display:flex;align-items:center;gap:14px}.logo{display:flex;align-items:center;justify-content:center;width:66px;height:66px;flex:0 0 66px;overflow:hidden;border:2px solid #ffffff52;border-radius:18px;background:#fff}.logo img{width:60px;height:60px;object-fit:contain;border-radius:13px}
.brand h1{margin:0;font-family:Montserrat,sans-serif;font-size:clamp(18px,2vw,29px)}.brand small{display:block;margin-top:4px;color:#60a5fa;font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#ffffff12;color:#fff;font-weight:800}
.progress-wrap{margin:18px 0;padding:14px 18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.progress-info{display:flex;justify-content:space-between;margin-bottom:9px;color:var(--muted);font-weight:800}.progress-info strong{color:#fde68a}.progress{height:15px;overflow:hidden;border-radius:999px;background:#020b16}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#facc15,var(--green));transition:.4s}
.stage{min-height:670px;display:grid;place-items:center;padding:clamp(20px,4vw,42px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(12,37,65,.94),rgba(4,18,34,.94));box-shadow:var(--shadow)}.slide{width:min(1080px,100%);animation:enter .4s ease}@keyframes enter{from{opacity:0;transform:translateY(20px)}}
.badge{display:inline-block;padding:9px 16px;border:1px solid #f59e0b73;border-radius:999px;background:#f59e0b26;color:#fde68a;font-weight:900}.hero{text-align:center}.hero .big{font-size:clamp(95px,13vw,165px);margin:18px 0}.hero h2,.title{font-family:Montserrat,sans-serif}.hero h2{font-size:clamp(36px,5.7vw,72px);margin:0 0 16px}.hero p,.lead{color:var(--muted);font-size:clamp(18px,2vw,24px);line-height:1.75}.title{font-size:clamp(30px,4vw,50px);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:25px}.card{min-height:210px;padding:23px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#ffffff16,#ffffff09);text-align:center}.card .icon{font-size:55px;margin-bottom:12px}.card h3{font-family:Montserrat,sans-serif;margin:0 0 9px}.card p{margin:0;color:var(--muted);line-height:1.65}
.hotspots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.hotspot{padding:18px;border:1px solid var(--line);border-radius:16px;background:#ffffff0d;color:#fff;font-weight:800}.hotspot.active{border-color:var(--green);background:#16a34a22}.hotspot span{display:block;font-size:42px;margin-bottom:8px}
.order{display:grid;gap:12px;margin-top:22px}.step{padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff0d;transition:.2s}.step button{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:800}.step.selected{border-color:var(--green);background:#16a34a22}.step.selected button{background:linear-gradient(135deg,#15803d,#22c55e)}.step.wrong{border-color:var(--red);background:#dc262622}
.order-status{margin-top:16px;padding:15px;border-radius:14px;font-weight:800}.order-status.good{background:#16a34a2e;color:#bbf7d0;border:1px solid #22c55e88}.order-status.bad{background:#dc26262b;color:#fecaca;border:1px solid #ef444480}
.activity{padding:26px;border:1px solid var(--line);border-radius:22px;background:#ffffff0d}.question{font-family:Montserrat,sans-serif;font-size:clamp(21px,2.7vw,32px);font-weight:900;margin-bottom:20px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.answers button{min-height:68px;padding:16px 18px;border:1px solid var(--line);border-radius:15px;background:#ffffff0e;color:#fff;font-weight:800;text-align:left}.answers button.correct{border-color:#22c55e;background:#16a34a4d}.answers button.incorrect{border-color:#ef4444;background:#dc262633}.feedback{display:none;margin-top:16px;padding:15px;border-radius:14px;font-weight:800}.feedback.show{display:block}.feedback.good{background:#16a34a2e;color:#bbf7d0;border:1px solid #22c55e88}.feedback.bad{background:#dc26262b;color:#fecaca;border:1px solid #ef444480}
.summary{text-align:center}.summary .trophy{font-size:130px}.reward{display:inline-grid;grid-template-columns:repeat(3,auto);gap:18px;margin:23px 0;padding:19px 25px;border:1px solid #f59e0b59;border-radius:20px;background:#f59e0b1f}.reward div{min-width:125px}.reward span,.reward b{display:block}.reward span{color:var(--muted);font-size:13px}.reward b{color:#fde68a;font-size:27px}
.nav{display:flex;justify-content:space-between;gap:14px;margin-top:18px}.nav button{min-width:165px;padding:14px 21px;border:0;border-radius:14px;color:#fff;font-weight:900}.back{background:#ffffff17;border:1px solid var(--line)!important}.next{background:linear-gradient(135deg,var(--blue),var(--purple))}.kt{background:linear-gradient(135deg,var(--orange),#d97706);color:#111827!important}
.toast{position:fixed;left:50%;top:22px;z-index:100;transform:translateX(-50%) translateY(-120px);padding:14px 20px;border-radius:14px;background:#052e16;color:#dcfce7;border:1px solid #22c55e;font-weight:900;box-shadow:var(--shadow);transition:.35s}.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.grid,.hotspots{grid-template-columns:1fr 1fr}}@media(max-width:700px){.header{position:relative;flex-direction:column;align-items:flex-start}.tools{width:100%}.tools button{flex:1}.grid,.answers,.hotspots{grid-template-columns:1fr}.nav{flex-direction:column}.nav button{width:100%}}
</style>
</head>
<body>
<div class="toast" id="toast">🎉 Tahniah! Urutan betul. +20 XP</div>
<main id="app"></main>
<script src="../storage.js"></script>
<script src="../firebase-sync.js?v=1.1.0"></script>
<script type="module" src="../firebase-config.js?v=1.1.0"></script>
<script>
const app=document.getElementById("app");
if(!window.C05Storage)throw new Error("storage.js tidak ditemui");
let state=C05Storage.load();
if(!state.student){location.href="../index.html";throw new Error("Pelajar belum login")}
const lang=state.lang||"ms";
let slide=0,activityDone=false,orderDone=false,orderRewardGiven=false;
const explored=new Set();
const chosen=[];
const T={
 ms:{title:"Keselamatan Bilik Server",dash:"Dashboard",audio:"Audio",full:"Skrin Penuh",progress:"Kemajuan Pembelajaran",back:"KEMBALI",next:"SETERUSNYA",finish:"SELESAI KP03",toKT:"TERUSKAN KE KT03",need:"Terokai semua hotspot keselamatan terlebih dahulu.",needOrder:"Susun semua langkah dengan urutan yang betul.",needAct:"Jawab aktiviti dengan betul dahulu.",correct:"Betul! Akses bilik server perlu dikawal dan hanya personel diberi kuasa dibenarkan masuk.",wrong:"Belum tepat. Cuba semula.",audioOn:"Audio diaktifkan.",audioOff:"Audio dimatikan.",orderGood:"Tahniah! Urutan betul.",orderBad:"Urutan belum betul. Tekan RESET dan cuba semula."},
 en:{title:"Server Room Safety",dash:"Dashboard",audio:"Audio",full:"Fullscreen",progress:"Learning Progress",back:"BACK",next:"NEXT",finish:"COMPLETE KP03",toKT:"CONTINUE TO KT03",need:"Explore all safety hotspots first.",needOrder:"Arrange all steps in the correct order.",needAct:"Answer the activity correctly first.",correct:"Correct! Server room access must be controlled and restricted to authorised personnel.",wrong:"Not correct yet. Try again.",audioOn:"Audio enabled.",audioOff:"Audio disabled.",orderGood:"Well done! Correct order.",orderBad:"The order is incorrect. Press RESET and try again."}
};
const t=k=>T[lang]?.[k]||T.ms[k]||k;
const slides=[
 {type:"intro",ms:{badge:"MISI KETIGA",title:"Lindungi Bilik Server",lead:"Kenal pasti bahaya, kawalan akses dan prosedur kecemasan bagi memastikan bilik server sentiasa selamat."},en:{badge:"THIRD MISSION",title:"Protect the Server Room",lead:"Identify hazards, access controls and emergency procedures to keep the server room safe."}},
 {type:"hazards",ms:{title:"Bahaya Utama",lead:"Bilik server mempunyai risiko elektrik, haba, kebakaran dan akses tanpa kebenaran."},en:{title:"Main Hazards",lead:"Server rooms face electrical, heat, fire and unauthorised-access risks."}},
 {type:"environment",ms:{title:"Kawalan Persekitaran",lead:"Suhu, kelembapan dan pengudaraan perlu dipantau."},en:{title:"Environmental Control",lead:"Temperature, humidity and ventilation must be monitored."}},
 {type:"hotspot",ms:{title:"Hotspot Keselamatan",lead:"Klik semua elemen untuk melihat fungsi keselamatan."},en:{title:"Safety Hotspots",lead:"Click every item to view its safety function."}},
 {type:"access",ms:{title:"Kawalan Akses",lead:"Hanya personel diberi kuasa dibenarkan masuk dan semua lawatan direkodkan."},en:{title:"Access Control",lead:"Only authorised personnel may enter, and all visits must be recorded."}},
 {type:"order",ms:{title:"Susun Prosedur Kecemasan",lead:"Klik langkah mengikut urutan yang betul."},en:{title:"Arrange the Emergency Procedure",lead:"Click the steps in the correct order."}},
 {type:"activity",correct:1,ms:{title:"Mini Aktiviti",q:"Siapakah yang dibenarkan memasuki bilik server?",a:["Semua pelajar","Personel yang diberi kuasa sahaja","Mana-mana pelawat","Sesiapa yang mempunyai telefon"]},en:{title:"Mini Activity",q:"Who may enter the server room?",a:["All students","Authorised personnel only","Any visitor","Anyone carrying a phone"]}},
 {type:"summary",ms:{title:"Ringkasan KP03",points:["Kenal pasti bahaya elektrik, haba dan kebakaran.","Pantau suhu, kelembapan dan pengudaraan.","Gunakan kawalan akses dan rekod pelawat.","Ikuti prosedur kecemasan yang betul."]},en:{title:"KP03 Summary",points:["Identify electrical, heat and fire hazards.","Monitor temperature, humidity and ventilation.","Use access control and visitor records.","Follow the correct emergency procedure."]}},
 {type:"complete",ms:{title:"Misi KP03 Selesai",lead:"Anda telah memahami asas keselamatan bilik server. Seterusnya jawab KT03."},en:{title:"KP03 Mission Completed",lead:"You understand the basics of server room safety. Next, complete KT03."}}
];
function c(){return slides[slide][lang]||slides[slide].ms}
function card(icon,title,body){return `<article class="card"><div class="icon">${icon}</div><h3>${title}</h3><p>${body}</p></article>`}
function render(){
 const p=Math.round((slide+1)/slides.length*100);
 app.innerHTML=`<div class="shell"><header class="header"><div class="brand"><div class="logo"><img src="../assets/logo-mentari.jpg" alt="Logo Kolej Kemahiran Mentari" onerror="this.style.display='none';this.parentElement.textContent='🏫'"></div><div><h1>KP03 · ${t("title")}</h1><small>C05 – SERVER MAINTENANCE</small></div></div><div class="tools"><button onclick="dash()">← ${t("dash")}</button><button onclick="audio()">${state.audio?"🔊":"🔇"} ${t("audio")}</button><button onclick="full()">⛶ ${t("full")}</button></div></header><section class="progress-wrap"><div class="progress-info"><span>${t("progress")}</span><strong>${p}%</strong></div><div class="progress"><i style="width:${p}%"></i></div></section><section class="stage">${view()}</section>${nav()}</div>`;
}
function view(){
 const x=c(),type=slides[slide].type;
 if(type==="intro")return `<article class="slide hero"><div class="badge">${x.badge}</div><div class="big">🔐</div><h2>${x.title}</h2><p>${x.lead}</p></article>`;
 if(type==="hazards")return `<article class="slide"><h2 class="title">⚠️ ${x.title}</h2><p class="lead">${x.lead}</p><div class="grid">${card("⚡",lang==="ms"?"Elektrik":"Electrical",lang==="ms"?"Risiko renjatan, litar pintas dan kehilangan kuasa.":"Risk of shock, short circuit and power loss.")}${card("🔥",lang==="ms"?"Kebakaran":"Fire",lang==="ms"?"Perlu sistem pengesan dan pemadam yang sesuai.":"Requires suitable detection and suppression systems.")}${card("🌡️",lang==="ms"?"Haba":"Heat",lang==="ms"?"Suhu tinggi boleh merosakkan komponen server.":"High temperature can damage server components.")}</div></article>`;
 if(type==="environment")return `<article class="slide"><h2 class="title">🌬️ ${x.title}</h2><p class="lead">${x.lead}</p><div class="grid">${card("🌡️",lang==="ms"?"Suhu":"Temperature",lang==="ms"?"Gunakan penghawa dingin dan sensor suhu.":"Use air conditioning and temperature sensors.")}${card("💧",lang==="ms"?"Kelembapan":"Humidity",lang==="ms"?"Elakkan kelembapan terlalu tinggi atau terlalu rendah.":"Avoid humidity that is too high or too low.")}${card("🌀",lang==="ms"?"Aliran Udara":"Airflow",lang==="ms"?"Pastikan laluan udara panas dan sejuk tidak terhalang.":"Keep hot and cold airflow paths unobstructed.")}</div></article>`;
 if(type==="hotspot"){
  const items=[
   ["access","🚪",lang==="ms"?"Pintu Akses":"Access Door",lang==="ms"?"Kunci elektronik atau biometrik mengawal kemasukan.":"Electronic or biometric locks control entry."],
   ["camera","📹",lang==="ms"?"CCTV":"CCTV",lang==="ms"?"Merakam aktiviti dan menyokong audit keselamatan.":"Records activity and supports security audits."],
   ["fire","🧯",lang==="ms"?"Pemadam Api":"Fire Extinguisher",lang==="ms"?"Gunakan jenis yang sesuai untuk peralatan elektrik.":"Use a type suitable for electrical equipment."],
   ["sensor","🚨",lang==="ms"?"Pengesan Asap":"Smoke Detector",lang==="ms"?"Memberi amaran awal jika berlaku kebakaran.":"Provides early warning of fire."],
   ["ups","🔋","UPS",lang==="ms"?"Menyediakan kuasa sementara ketika bekalan terputus.":"Provides temporary power during an outage."],
   ["sign","⛔",lang==="ms"?"Tanda Amaran":"Warning Sign",lang==="ms"?"Menunjukkan kawasan terhad dan prosedur keselamatan.":"Marks restricted areas and safety procedures."]
  ];
  return `<article class="slide"><h2 class="title">🛡️ ${x.title}</h2><p class="lead">${x.lead}</p><div class="hotspots">${items.map(v=>`<button class="hotspot ${explored.has(v[0])?"active":""}" onclick="hotspot('${v[0]}')"><span>${v[1]}</span>${v[2]}<small style="display:block;margin-top:8px;color:#cbd5e1">${explored.has(v[0])?v[3]:(lang==="ms"?"Klik untuk lihat":"Click to view")}</small></button>`).join("")}</div>${explored.size===items.length?'<div class="feedback show good">'+(lang==="ms"?"Semua hotspot telah diterokai.":"All hotspots have been explored.")+"</div>":""}</article>`;
 }
 if(type==="access")return `<article class="slide"><h2 class="title">🔑 ${x.title}</h2><p class="lead">${x.lead}</p><div class="grid">${card("🪪",lang==="ms"?"Kad Akses":"Access Card",lang==="ms"?"Hadkan kemasukan kepada staf yang diluluskan.":"Restrict entry to approved staff.")}${card("📖",lang==="ms"?"Log Pelawat":"Visitor Log",lang==="ms"?"Catat nama, masa masuk dan tujuan lawatan.":"Record name, entry time and visit purpose.")}${card("📹","CCTV",lang==="ms"?"Pantau pintu masuk dan kawasan kritikal.":"Monitor entrances and critical areas.")}</div></article>`;
 if(type==="order"){
  const steps=lang==="ms"?["Kenal pasti bahaya","Maklumkan pegawai bertanggungjawab","Putuskan kuasa jika selamat","Kosongkan kawasan","Rekod kejadian"]:["Identify the hazard","Notify the responsible officer","Isolate power if safe","Evacuate the area","Record the incident"];
  const finished=chosen.length===steps.length;
  const correct=finished&&chosen.every((v,i)=>v===i);
  return `<article class="slide"><h2 class="title">🚨 ${x.title}</h2><p class="lead">${x.lead}</p><div class="order">${steps.map((v,i)=>`<div class="step ${chosen.includes(i)?"selected":""} ${finished&&!correct&&chosen[i]!==i?"wrong":""}"><button onclick="pick(${i})" ${chosen.includes(i)||orderDone?"disabled":""}>${chosen.includes(i)?`✓ ${v}`:v}</button></div>`).join("")}</div>${finished?`<div class="order-status ${correct?"good":"bad"}">${correct?t("orderGood"):t("orderBad")}</div>`:""}<div style="margin-top:14px"><button onclick="resetOrder()" style="padding:10px 14px;border:0;border-radius:10px;background:#ffffff18;color:#fff;font-weight:800">RESET</button></div></article>`;
 }
 if(type==="activity")return `<article class="slide"><h2 class="title">🎮 ${x.title}</h2><div class="activity"><div class="question">${x.q}</div><div class="answers">${x.a.map((v,i)=>`<button onclick="answer(${i},this)" ${activityDone?"disabled":""}>${String.fromCharCode(65+i)}. ${v}</button>`).join("")}</div><div class="feedback" id="fb"></div></div></article>`;
 if(type==="summary")return `<article class="slide"><h2 class="title">🧠 ${x.title}</h2><div class="grid">${x.points.map((v,i)=>card(["⚠️","🌡️","🔑","🚨"][i],String(i+1),v)).join("")}</div></article>`;
 return `<article class="slide summary"><div class="trophy">🏆</div><h2 class="title">${x.title}</h2><p class="lead">${x.lead}</p><div class="reward"><div><span>XP</span><b>+100</b></div><div><span>${lang==="ms"?"Syiling":"Coins"}</span><b>+50</b></div><div><span>${lang==="ms"?"Lencana":"Badge"}</span><b>🔐</b></div></div></article>`;
}
function nav(){
 const first=slide===0,last=slide===slides.length-1;
 return `<nav class="nav"><button class="back" onclick="prev()" ${first?"disabled":""}>← ${t("back")}</button>${last?`<button class="kt" onclick="toKT()">${t("toKT")} →</button>`:`<button class="next" onclick="next()">${slide===slides.length-2?t("finish"):t("next")} →</button>`}</nav>`;
}
function next(){
 const type=slides[slide].type;
 if(type==="hotspot"&&explored.size<6){alert(t("need"));return}
 if(type==="order"&&!orderDone){alert(t("needOrder"));return}
 if(type==="activity"&&!activityDone){alert(t("needAct"));return}
 if(slide<slides.length-1){slide++;render();scrollTo({top:0,behavior:"smooth"})}
}
function prev(){if(slide>0){slide--;render();scrollTo({top:0,behavior:"smooth"})}}
function hotspot(id){explored.add(id);beep(660);render()}
function pick(i){
 if(orderDone||chosen.includes(i))return;
 chosen.push(i);
 if(chosen.length===5){
   const correct=chosen.every((v,index)=>v===index);
   if(correct){
     orderDone=true;
     if(!orderRewardGiven){
       state.xp=(state.xp||0)+20;
       C05Storage.save(state);
       orderRewardGiven=true;
     }
     beep(880);
     const toast=document.getElementById("toast");
     toast.textContent=lang==="ms"?"🎉 Tahniah! Urutan betul. +20 XP":"🎉 Correct order! +20 XP";
     toast.classList.add("show");
     setTimeout(()=>toast.classList.remove("show"),2500);
   }else{
     beep(220);
   }
 }
 render();
}
function resetOrder(){chosen.splice(0);orderDone=false;render()}
function answer(i,btn){
 if(activityDone)return;
 document.querySelectorAll(".answers button").forEach(b=>b.classList.remove("correct","incorrect"));
 const fb=document.getElementById("fb");
 if(i===1){
   btn.classList.add("correct");
   fb.className="feedback show good";
   fb.textContent=t("correct");
   activityDone=true;
   document.querySelectorAll(".answers button").forEach(b=>b.disabled=true);
   beep(880);
 }else{
   btn.classList.add("incorrect");
   fb.className="feedback show bad";
   fb.textContent=t("wrong");
   beep(220);
 }
}
function completeKP03(){
 const done=Array.isArray(state.completedKP)?state.completedKP:[];
 const already=done.includes(3);
 C05Storage.completeKP(state,3);
 if(!already){
   state.xp=(state.xp||0)+100;
   state.coins=(state.coins||0)+50;
   if(!Array.isArray(state.badges))state.badges=[];
   if(!state.badges.includes("kp03-complete"))state.badges.push("kp03-complete");
 }
 C05Storage.save(state);
}
function toKT(){completeKP03();location.href="../kt/kt03.html"}
function dash(){location.href="../index.html"}
function audio(){state.audio=!state.audio;C05Storage.save(state);alert(state.audio?t("audioOn"):t("audioOff"));render()}
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function beep(f){if(!state.audio)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.stop(c.currentTime+.18)}catch(e){}}
window.next=next;window.prev=prev;window.hotspot=hotspot;window.pick=pick;window.resetOrder=resetOrder;window.answer=answer;window.toKT=toKT;window.dash=dash;window.audio=audio;window.full=full;
render();
</script>
</body>
</html>
